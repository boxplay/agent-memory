<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>记忆星云 · Memory Galaxy</title>
<style>
  :root{
    --bg:#05060d;
    --ink:#e7edff;
    --dim:#8b97b8;
    --line:rgba(150,175,230,.12);
    --glass:rgba(14,18,34,.62);
    --gold:#ffd166;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
  #stage.dragging{cursor:grabbing}
  #stage.pointer{cursor:pointer}

  /* ---------- top bar ---------- */
  .topbar{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;gap:18px;
    padding:0 22px;z-index:20;pointer-events:none}
  .topbar > *{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:12px;user-select:none}
  .brand .orb{width:30px;height:30px;border-radius:50%;position:relative;
    background:radial-gradient(circle at 35% 35%,#fff6d8 0%,#ffd166 30%,#f0a83a 60%,rgba(240,168,58,0) 72%);
    box-shadow:0 0 22px rgba(255,209,102,.55),0 0 60px rgba(255,168,58,.25)}
  .brand .orb:after{content:"";position:absolute;inset:-7px;border-radius:50%;
    border:1px solid rgba(255,209,102,.25)}
  .brand h1{font-size:14px;letter-spacing:.28em;margin:0;font-weight:600;color:#dfe8ff}
  .brand .sub{font-size:11px;color:var(--dim);letter-spacing:.12em;margin-top:2px}
  .search-wrap{position:relative;flex:0 1 380px}
  .search-wrap input{width:100%;height:34px;border-radius:17px;border:1px solid var(--line);
    background:rgba(12,16,30,.55);color:var(--ink);padding:0 14px 0 34px;font-size:12.5px;outline:none;
    backdrop-filter:blur(12px);transition:.2s}
  .search-wrap input:focus{border-color:rgba(120,170,255,.45);box-shadow:0 0 0 3px rgba(90,140,255,.08)}
  .search-wrap .ico{position:absolute;left:13px;top:9px;width:13px;height:13px;border:1.5px solid #6b7aa0;
    border-radius:50%;pointer-events:none}
  .search-wrap .ico:after{content:"";position:absolute;width:6px;height:1.5px;background:#6b7aa0;
    transform:rotate(45deg);left:9px;top:9px;border-radius:2px}
  .search-results{position:absolute;top:40px;left:0;right:0;background:rgba(13,17,32,.96);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none;
    box-shadow:0 18px 50px rgba(0,0,0,.55);backdrop-filter:blur(18px)}
  .search-results.on{display:block}
  .sr-item{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;font-size:12.5px}
  .sr-item:hover{background:rgba(120,160,255,.09)}
  .sr-item .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .sr-item .tp{font-size:10px;color:var(--dim);margin-left:auto}
  /* ---------- P1-3 搜索（/recall） / P1-4 过滤器 ---------- */
  .sr-item.sel{background:rgba(120,160,255,.16)}
  .sr-item .sr-tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sr-group{font-size:9.5px;letter-spacing:.16em;color:#5f6d8e;padding:6px 12px 2px}
  .search-results mark{background:rgba(120,170,255,.25);color:#e6eeff;border-radius:3px;padding:0 1px}
  .filter-panel{position:fixed;right:22px;top:70px;z-index:36;width:min(360px,92vw);display:none;
    background:linear-gradient(180deg,rgba(16,21,40,.97),rgba(10,13,26,.98));
    border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.55);
    padding:12px 14px 10px;backdrop-filter:blur(18px)}
  .filter-panel.open{display:block}
  .fp-grp{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid rgba(120,160,255,.07)}
  .fp-grp:last-of-type{border-bottom:none}
  .fp-t{flex:none;width:34px;font-size:10px;color:#66749a;letter-spacing:.14em;padding-top:5px}
  .fp-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
  .chip-filter{font-size:10.5px;padding:3px 9px;border-radius:10px;cursor:pointer;
    border:1px solid rgba(255,255,255,.10);background:rgba(14,19,36,.6);color:#aebbd8;transition:.15s}
  .chip-filter:hover{border-color:rgba(130,170,255,.4);color:#fff}
  .chip-filter.on{border-color:rgba(255,209,102,.5);color:#ffe6a8;background:rgba(255,209,102,.08)}
  .fp-foot{display:flex;align-items:center;gap:10px;padding-top:8px}
  .fp-foot #fpCount{flex:1;font-size:10px;color:#5f6d8e}
  .fp-foot .btn{height:26px;font-size:10.5px;padding:0 10px}
  .scrubber{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:25;display:flex;align-items:center;
    gap:5px;max-width:min(780px,94vw);padding:6px 10px;border-radius:14px;background:rgba(13,17,32,.82);
    border:1px solid var(--line);backdrop-filter:blur(16px);flex-wrap:wrap;justify-content:center}
  .scrubber .sc{font-size:10px;padding:3px 8px;border-radius:9px;border:1px solid rgba(255,255,255,.10);
    background:rgba(14,19,36,.6);color:#9fb0d4;cursor:pointer;transition:.15s}
  .scrubber .sc:hover{border-color:rgba(130,170,255,.4);color:#fff}
  .scrubber .sc.on{border-color:rgba(255,209,102,.5);color:#ffe6a8;background:rgba(255,209,102,.08)}
  .scrubber .sc.latest{color:#8fe8c8}
  .scrubber .sc-sum{font-size:9.5px;color:#5f6d8e;max-width:280px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;margin-left:6px}
  .stats{font-size:11px;color:var(--dim);letter-spacing:.06em;white-space:nowrap}
  .stats b{color:#cfd9f5;font-weight:600}
  .actions{margin-left:auto;display:flex;gap:8px}
  .btn{height:30px;padding:0 13px;border-radius:15px;border:1px solid var(--line);
    background:rgba(14,19,36,.6);color:#c9d4ee;font-size:11.5px;cursor:pointer;
    backdrop-filter:blur(10px);transition:.2s;letter-spacing:.04em}
  .btn:hover{border-color:rgba(130,170,255,.4);color:#fff;background:rgba(30,42,80,.6)}
  .btn.on{border-color:rgba(255,209,102,.5);color:#ffe6a8;box-shadow:0 0 14px rgba(255,200,90,.15)}
  .btn:disabled{opacity:.35;cursor:not-allowed}

  /* ---------- legend ---------- */
  .legend{position:fixed;left:20px;bottom:18px;z-index:20;display:flex;flex-direction:column;gap:7px;
    padding:12px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(16px);user-select:none}
  .legend .ttl{font-size:10px;letter-spacing:.2em;color:#6f7d9e;margin-bottom:2px}
  .lg{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#b9c5e2;cursor:pointer;
    opacity:.95;transition:.15s}
  .lg:hover{color:#fff}
  .lg.off{opacity:.3;text-decoration:line-through}
  .lg .dot{width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px currentColor}
  .lg .n{margin-left:auto;color:#63708f;font-size:10px;padding-left:14px}

  /* ---------- detail panel ---------- */
  .panel{position:fixed;top:76px;right:18px;bottom:18px;width:360px;z-index:30;
    border-radius:18px;background:linear-gradient(180deg,rgba(16,21,40,.92),rgba(10,13,26,.94));
    border:1px solid var(--line);backdrop-filter:blur(22px);
    box-shadow:0 30px 80px rgba(0,0,0,.55);
    transform:translateX(calc(100% + 30px));transition:transform .35s cubic-bezier(.2,.9,.3,1);
    display:flex;flex-direction:column;overflow:hidden}
  .panel.open{transform:none}
  .p-head{display:flex;align-items:center;gap:9px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  .p-head .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 10px currentColor}
  .p-head .tp{font-size:10.5px;letter-spacing:.16em;color:#93a2c4}
  .p-head .close{margin-left:auto;width:24px;height:24px;border-radius:8px;border:none;background:transparent;
    color:#7f8db0;font-size:16px;cursor:pointer;line-height:1}
  .p-head .close:hover{background:rgba(255,255,255,.06);color:#fff}
  .p-body{padding:16px 18px 10px;overflow:auto;flex:1}
  @keyframes swapIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .p-body.swap{animation:swapIn .28s cubic-bezier(.2,.8,.3,1)}
  .p-title{font-size:16px;line-height:1.5;margin:0 0 12px;font-weight:600;color:#eef3ff}
  .p-content{font-size:12.5px;line-height:1.85;color:#aeb9d6;white-space:pre-wrap}
  .p-meta{display:flex;flex-direction:column;gap:7px;margin:16px 0 4px;padding-top:14px;border-top:1px solid var(--line)}
  .p-meta .row{display:flex;gap:10px;font-size:11px}
  .p-meta .k{width:44px;color:#5f6d8e;flex:none}
  .p-meta .v{color:#9fadd0}
  .p-quote{font-size:12px;line-height:1.75;color:#94a3c4;white-space:pre-wrap;word-break:break-word;
    background:rgba(255,255,255,.02);border-left:2px solid rgba(120,160,255,.28);
    padding:8px 10px;border-radius:6px;user-select:text;max-height:120px;overflow:auto}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:2px 9px;border-radius:10px;
    border:1px solid rgba(255,255,255,.09);color:#b9c6e6}
  .chip.pending{color:#ff9d9d;border-color:rgba(255,107,107,.3);background:rgba(255,107,107,.08)}
  .chip.done{color:#7fe3bc;border-color:rgba(90,220,170,.25);background:rgba(90,220,170,.07)}
  .chip.expired{color:#8d93a6;border-color:rgba(160,170,200,.18)}
  .p-sec{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-size:10.5px;letter-spacing:.16em;color:#66749a}
  .p-sec:after{content:"";flex:1;height:1px;background:var(--line)}
  .rel{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;cursor:pointer;transition:.15s}
  .rel:hover{background:rgba(120,160,255,.09)}
  .rel .dot{width:6px;height:6px;border-radius:50%;flex:none;box-shadow:0 0 7px currentColor}
  .rel .lb{font-size:12px;color:#c2cce8;line-height:1.45}
  .rel .tp{font-size:9.5px;color:#5f6d8e;margin-left:auto;flex:none;padding-left:8px}
  .p-actions{display:flex;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
  .p-actions .btn{flex:1;height:32px}

  /* ---------- list modal ---------- */
  .modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(3,4,10,.55);backdrop-filter:blur(6px)}
  .modal.open{display:flex}
  .modal-card{width:min(720px,92vw);max-height:82vh;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;
    background:linear-gradient(180deg,rgba(18,23,44,.97),rgba(10,13,26,.98));border:1px solid var(--line);
    box-shadow:0 40px 120px rgba(0,0,0,.7)}
  .m-head{display:flex;align-items:center;gap:16px;padding:18px 22px 0}
  .m-head h2{font-size:14px;margin:0;letter-spacing:.18em;color:#dbe4ff;font-weight:600}
  .m-head .close{margin-left:auto;width:28px;height:28px;border-radius:9px;border:none;background:transparent;
    color:#7f8db0;font-size:18px;cursor:pointer}
  .m-head .close:hover{background:rgba(255,255,255,.06);color:#fff}
  .tabs{display:flex;gap:6px;padding:14px 22px 10px}
  .tab{padding:6px 14px;border-radius:14px;font-size:11.5px;color:#8b98ba;cursor:pointer;border:1px solid transparent}
  .tab:hover{color:#dbe4ff}
  .tab.on{background:rgba(120,160,255,.12);border-color:rgba(120,160,255,.25);color:#dbe4ff}
  .m-body{padding:4px 22px 22px;overflow:auto}
  .day-block{margin-bottom:18px}
  .day-h{display:flex;align-items:baseline;gap:10px;margin:14px 0 7px}
  .day-h .d{font-size:12.5px;color:#e3eaff;font-weight:600;letter-spacing:.06em}
  .day-h .s{font-size:11px;color:#6f7d9e;line-height:1.5}
  .row{display:flex;align-items:flex-start;gap:9px;padding:7px 9px;border-radius:9px;cursor:pointer}
  .row:hover{background:rgba(120,160,255,.08)}
  .row .dot{width:6px;height:6px;border-radius:50%;margin-top:5px;flex:none;box-shadow:0 0 7px currentColor}
  .row .tx{font-size:12px;color:#b9c5e2;line-height:1.6}
  .row .st{margin-left:auto;font-size:10px;color:#7886a8;flex:none;padding-left:10px}

  .list-panel{position:fixed;left:18px;top:76px;bottom:18px;width:342px;z-index:30;border-radius:18px;
    background:linear-gradient(180deg,rgba(16,21,40,.92),rgba(10,13,26,.94));
    border:1px solid var(--line);backdrop-filter:blur(22px);
    box-shadow:0 30px 80px rgba(0,0,0,.55);
    display:flex;flex-direction:column;overflow:hidden;
    transform:translateX(calc(-100% - 30px));transition:transform .35s cubic-bezier(.2,.9,.3,1)}
  body.list-open .list-panel{transform:none}
  .lp-head{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
  .lp-head h2{font-size:12px;margin:0;letter-spacing:.18em;color:#dbe4ff;font-weight:600}
  .lp-head .close{margin-left:auto;width:26px;height:26px;border-radius:8px;border:none;background:transparent;
    color:#7f8db0;font-size:16px;cursor:pointer;line-height:1}
  .lp-head .close:hover{background:rgba(255,255,255,.06);color:#fff}
  .lp-body{padding:8px 14px 16px;overflow:auto;flex:1}
  .list-panel .tabs{padding:10px 14px 6px}
  /* ---------- P1-1 今日卡片 / P1-2 列表行内操作 ---------- */
  .today{padding:8px 14px 6px;border-bottom:1px solid var(--line);max-height:42vh;overflow:auto;flex:none}
  .today-h{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.16em;color:#66749a;margin:2px 0 4px}
  .today-h .d{color:#8ea3cf;letter-spacing:.04em}
  .today-h .stale{font-size:9px;letter-spacing:0;padding:1px 6px;border-radius:8px;color:#ffd166;
    border:1px solid rgba(255,209,102,.35);background:rgba(255,209,102,.08)}
  .today-sec{margin:4px 0 2px}
  .today-sec .sh{display:flex;align-items:center;gap:6px;font-size:10px;color:#7f8db0;margin:5px 0 2px}
  .today-sec .sh b{font-weight:600;color:#a9b8dc}
  .today-sec .sh .n{margin-left:auto;color:#5f6d8e}
  .today-item{display:flex;gap:7px;align-items:baseline;padding:4px 6px;border-radius:7px;cursor:pointer;
    font-size:11.5px;color:#b9c5e2;line-height:1.5}
  .today-item:hover{background:rgba(120,160,255,.09)}
  .today-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .today-item .m{flex:none;font-size:9.5px;color:#5f6d8e}
  .today-empty{font-size:11px;color:#7f8db0;line-height:1.75;padding:2px 0 4px}
  .row-acts{display:flex;gap:4px;flex:none;margin-left:auto;opacity:0;transition:.15s;pointer-events:none}
  .row:hover .row-acts{opacity:1;pointer-events:auto}
  .row-acts .mini{height:19px;padding:0 7px;font-size:9.5px;line-height:17px;border-radius:9px}
  .row-acts .mini[disabled]{opacity:.35;cursor:not-allowed}
  .cat{font-size:9px;padding:1px 6px;border-radius:8px;margin-left:6px;flex:none;white-space:nowrap}
  .cat.work{color:#9fc3ff;background:rgba(90,140,255,.12);border:1px solid rgba(90,140,255,.22)}
  .cat.daily{color:#8fe8c8;background:rgba(80,220,170,.10);border:1px solid rgba(80,220,170,.22)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:60;
    background:rgba(22,29,52,.96);border:1px solid rgba(130,170,255,.25);color:#dbe4ff;
    font-size:12px;padding:9px 18px;border-radius:20px;opacity:0;pointer-events:none;transition:.3s;
    box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:15;
    font-size:10.5px;color:#4e5b7a;letter-spacing:.1em;user-select:none;pointer-events:none}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 45%,rgba(0,0,0,.40) 100%)}
  .noanim .panel,.noanim .modal,.noanim .toast{transition:none !important}
  .lite .panel,.lite .legend,.lite .search-wrap input,.lite .btn,.lite .modal-card{backdrop-filter:none !important}

  /* ---------- W2b：最近写入 / 撤销 ---------- */
  .w-item{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid rgba(120,160,255,.08)}
  .w-item:last-child{border-bottom:none}
  .w-item .w-main{flex:1;min-width:0}
  .w-item .w-tx{font-size:12px;color:#b9c5e2;line-height:1.6;word-break:break-word}
  .w-item .w-meta{font-size:10px;color:#6f7d9e;margin-top:4px;letter-spacing:.04em}
  .w-item .w-btns{display:flex;gap:6px;align-items:flex-start;flex:none}
  .w-item .w-btns .btn{padding:3px 9px;font-size:10.5px;height:auto;line-height:1.5}
  .w-item.hidden .w-tx{color:#5f6d8e;text-decoration:line-through}
  .w-item.hidden .w-meta{color:#4e5b7a}
  .w-empty{padding:16px 4px;color:#8b98ba;font-size:12px;line-height:1.8}
  .w-empty code{color:#9fc3ff}
  #err{position:fixed;left:12px;right:12px;bottom:12px;z-index:99;display:none;white-space:pre-wrap;
    background:#3a0d14;color:#ffb3b3;font:11px/1.5 ui-monospace,Menlo,monospace;padding:10px 14px;border-radius:10px}
  /* ---------- P2：错误/空态/响应式/可访问性 ---------- */
  .health-bar{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:38;display:none;
    max-width:min(720px,92vw);padding:7px 14px;border-radius:12px;font-size:11px;line-height:1.6;
    color:#ffd166;background:rgba(58,42,10,.92);border:1px solid rgba(255,209,102,.35);box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .health-bar.on{display:block}
  .health-bar.err{color:#ffb3b3;background:rgba(58,13,20,.94);border-color:rgba(255,120,120,.35)}
  .list-empty{padding:18px 6px;color:#7f8db0;font-size:11.5px;line-height:1.8}
  :focus-visible{outline:2px solid rgba(120,170,255,.65);outline-offset:2px}
  .joy{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:27;width:96px;height:96px;
    border-radius:50%;background:radial-gradient(circle at 50% 42%,rgba(30,40,70,.82),rgba(10,14,26,.9));
    border:1px solid rgba(120,160,255,.25);box-shadow:0 12px 34px rgba(0,0,0,.5);
    touch-action:none;user-select:none;cursor:grab}
  .joy.dragging{cursor:grabbing}
  .joy-knob{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,rgba(150,190,255,.85),rgba(60,90,160,.65));
    border:1px solid rgba(180,210,255,.5);transition:transform .06s linear;box-shadow:0 4px 14px rgba(0,0,0,.45)}
  .joy.dragging .joy-knob{transition:none}
  .joy-a{position:absolute;font-size:9px;color:rgba(150,175,225,.5);pointer-events:none}
  .joy-a.up{left:50%;top:6px;transform:translateX(-50%)}
  .joy-a.down{left:50%;bottom:6px;transform:translateX(-50%)}
  .joy-a.left{left:7px;top:50%;transform:translateY(-50%)}
  .joy-a.right{right:7px;top:50%;transform:translateY(-50%)}
  @media (max-width:900px){ .joy{bottom:calc(44vh + 64px);width:78px;height:78px} }
  @media (max-width:1280px){
    .panel{width:300px}
    .list-panel{width:300px}
    .search-wrap{flex-basis:280px}
    .filter-panel{right:12px}
  }
  @media (max-width:900px){
    .panel{width:min(340px,48vw)}
    .list-panel{left:8px;right:8px;bottom:8px;top:auto;height:44vh;width:auto}
    .legend{display:none}
    .topbar{height:auto;flex-wrap:wrap;padding:8px 12px;gap:8px}
    .search-wrap{flex:1 1 100%;order:3}
    .actions{flex-wrap:wrap}
    .scrubber{bottom:calc(44vh + 14px);max-width:94vw}
    .hint{display:none}
  }
  @media (prefers-reduced-motion: reduce){
    .p-body.swap{animation:none}
    .panel,.list-panel,.modal,.toast,.rel,.btn,.chip-filter,.scrubber .sc{transition-duration:.001s !important}
  }
</style>
</head>
<body>

/* ---------- 数据选择：优先真实 bundle，否则用 mock ---------- */
const BUNDLE = (typeof window !== 'undefined' && window.__MEMORY__) ? window.__MEMORY__ : null;
const pickArr = (key, fallback) => (BUNDLE && Array.isArray(BUNDLE[key])) ? BUNDLE[key] : fallback;
const TOPICS   = pickArr('topics', MOCK_TOPICS);
const ENTITIES = pickArr('entities', MOCK_ENTITIES);
const DAY_DEFS = pickArr('days', MOCK_DAY_DEFS);
const COMMITMENTS = pickArr('commitments', MOCK_COMMITMENTS);
const PROFILES = pickArr('profiles', MOCK_PROFILES);
const SEGMENTS = pickArr('segments', MOCK_SEGMENTS);
const ARTIFACTS = pickArr('artifacts', MOCK_ARTIFACTS);

/* ============================================================
   3. 构建节点与边（工作球 / 日常球 / 中央桥）
   ============================================================ */
const nodes = [];
const links = [];
const byId = {};
const cardNodes = [];
function addNode(n){
  n.r = TYPE[n.type].r;
  n.sx = 0; n.sy = 0; n.sz = 0;      // 所属球心（bridge 节点就是世界坐标）
  n.lx = 0; n.ly = 0; n.lz = 0;      // 球内局部坐标
  nodes.push(n); byId[n.id] = n; return n;
}
function addLink(s,t,rel){ links.push({ s:s, t:t, rel:rel }); }
function projLabel(src){
  if(!src || !src.project) return '其他';
  const parts = String(src.project).split('/').filter(Boolean);
  return parts[parts.length-1] || '其他';
}

const SPHERE = {
  work:  { x:-730, y:0, z:0, r:415 },
  daily: { x: 730, y:0, z:0, r:415 }
};
const CAT_LABEL = { work:'工作', daily:'日常' };

const persona = addNode({
  id:'persona', type:'persona', label:'阿墨',
  content: (BUNDLE && BUNDLE.persona && BUNDLE.persona.content) || '性格：结论先行；中文；能上表格就上表格；不确定就追问，不自己补需求；不喜欢空泛的"可以考虑"；复述关键点再动手。',
  meta:{ '角色':'记忆管家', '版本':'v3', '更新':'2026-10-29' }
});

PROFILES.forEach((p,i)=>{
  const n = addNode({ id:'pf'+i, type:'profile', label:p.k,
    content:p.v, meta:{ '类型':p.k, '来源':'长期画像' } });
  addLink('persona', n.id, 'has');
});

// 每个日期按分类拆成独立 day 节点
const dayNodes = {};
DAY_DEFS.forEach((d,di)=>{
  const cats = {};
  d.cards.forEach(c=>{ cats[c.cat || 'work'] = true; });
  ['work','daily'].forEach(cat=>{
    if(!cats[cat]) return;
    const dn = addNode({
      id:'day:'+cat+':'+d.date, type:'day', label:d.date.slice(5),
      content:d.summary,
      meta:{ '日期':d.date, '分类':CAT_LABEL[cat], '类型':'日摘要' },
      cat:cat, dayIndex:di, dayRef:d.date
    });
    dayNodes[cat+'|'+d.date] = dn;
  });
});

DAY_DEFS.forEach((d,di)=>{
  d.cards.forEach((c,ci)=>{
    const cat = c.cat || 'work';
    const id = 'c-' + d.date.slice(5) + '-' + ci;
    const n = addNode({
      id:id, type:'card',
      label: c.text.length>16 ? c.text.slice(0,16)+'…' : c.text,
      content: c.text,
      meta:{ '日期':d.date, '分类':CAT_LABEL[cat], '类型': c.t==='decision'?'决定':c.t==='preference'?'偏好':c.t==='correction'?'更正':'事件' },
      cardType:c.t, dayRef:d.date, cat:cat,
      project: projLabel(c.source),
      cardId: c.id || null,
      quote: c.quote || '',
      source: c.source || null,
      confidence: (typeof c.confidence === 'number') ? c.confidence : null
    });
    cardNodes.push(n);
    const dn = dayNodes[cat+'|'+d.date];
    if(dn) addLink(dn.id, n.id, 'contains');
    (c.topics||[]).forEach(t=>{ if(TOPICS.includes(t)) addLink(n.id, 'tp:'+t, 'mentions'); });
    (c.entities||[]).forEach(e=>{ if(ENTITIES.includes(e)) addLink(n.id, 'en:'+e, 'mentions'); });
    if(c.reminds) addLink(n.id, 'cm:'+c.reminds, 'reminds');
    if(c.artifact) addLink(n.id, 'af:'+c.artifact, 'produced');
    if(c.supersedes){
      const t = byId['c-' + c.supersedes.slice(2)];
      if(t) addLink(n.id, t.id, 'supersedes');
    }
  });
});

COMMITMENTS.forEach(c=>{
  const cat = c.cat || 'work';
  const n = addNode({ id:'cm:'+c.id, type:'commitment', label:c.short,
    content:c.text,
    meta:{ '截止':c.due, '分类':CAT_LABEL[cat], '状态': c.status==='pending'?'待处理':c.status==='done'?'已完成':'已逾期' },
    status:c.status, due:c.due, cat:cat, pinned:!!c.pinned,
    project: projLabel(c.source), dayRef: c.fromDay || null,
    cardId: String(c.id||'').replace(/^cm_/,'') || null,
    quote:c.quote || '', source:c.source || null,
    confidence:(typeof c.confidence === 'number') ? c.confidence : null });
  const dn = dayNodes[cat+'|'+c.due.slice(0,10)];
  if(dn) addLink(n.id, dn.id, 'due');
});

// 桥节点：主题 / 实体
TOPICS.forEach(t=>{
  addNode({ id:'tp:'+t, type:'topic', label:'#'+t, content:'主题：'+t, meta:{ '类型':'主题聚合','层级':'桥' }, bridge:true });
});
ENTITIES.forEach(e=>{
  addNode({ id:'en:'+e, type:'entity', label:e, content:'实体：'+e, meta:{ '类型':'实体','层级':'桥' }, bridge:true });
});

// 会话段 / 产物：属于工作球
SEGMENTS.forEach(s=>{
  const n = addNode({ id:'sg:'+s.id, type:'segment', label:s.label,
    content:s.summary, meta:{ '范围':s.range, '类型':'会话段' }, cat:'work' });
  s.days.forEach(d=>{ const dn = dayNodes['work|'+d]; if(dn) addLink(n.id, dn.id, 'covers'); });
});

ARTIFACTS.forEach(a=>{
  const n = addNode({ id:'af:'+a.id, type:'artifact', label:a.short,
    content:'产物：'+a.label, meta:{ '生成日':a.from, '分类':'工作', '类型':'文件' }, cat:'work' });
  const dn = dayNodes['work|'+a.from];

function fibDir(i, n){
  const off = 2/n;
  const y = i*off - 1 + off/2;
  const rad = Math.sqrt(Math.max(0, 1-y*y));
  const phi = i * Math.PI * (3 - Math.sqrt(5));
  return { x: Math.cos(phi)*rad, y: y, z: Math.sin(phi)*rad };
}
function cross(a,b){
  return { x:a.y*b.z - a.z*b.y, y:a.z*b.x - a.x*b.z, z:a.x*b.y - a.y*b.x };
}
function baseWorld(n){ return { x:n.sx+n.lx, y:n.sy+n.ly, z:n.sz+n.lz }; }

function layout(){
  // 中央：persona + 画像
  persona.sx = 0; persona.sy = 0; persona.sz = 0;
  const pf = nodes.filter(n=>n.type==='profile');
  pf.forEach((n,i)=>{
    const d = fibDir(i, pf.length);
    n.sx = d.x*95; n.sy = d.y*95; n.sz = d.z*95;
  });

  ['work','daily'].forEach(cat=>{
    const C = SPHERE[cat], R = C.r;

    // 日期：球面
    nodes.filter(n=>n.cat===cat && n.type==='day').forEach(n=>{
      const d = fibDir(n.dayIndex, DAY_DEFS.length);
      n.sx = C.x; n.sy = C.y; n.sz = C.z;
      n.lx = d.x*R; n.ly = d.y*R; n.lz = d.z*R;
      n.dir = d;
    });

    // 任务（卡片 + 承诺）：分布在球体积内（×cbrt 保证体积均匀），不再是表面星座
    const volumeNodes = nodes.filter(n=>n.cat===cat && (n.type==='card' || n.type==='commitment'));
    const vrnd = mulberry32(cat === 'work' ? 20261029 : 20261030);
    const dirs = [];
    for(let i=0;i<volumeNodes.length;i++) dirs.push(randDir(vrnd));
    volumeNodes.forEach((n,i)=>{
      const d = dirs[i];
      const rr = R * (0.20 + 0.78*Math.cbrt(vrnd()));   // 0.20R ~ 0.98R
      n.sx = C.x; n.sy = C.y; n.sz = C.z;
      n.lx = d.x*rr; n.ly = d.y*rr; n.lz = d.z*rr;
    });

    // 会话段：球外一圈
    nodes.filter(n=>n.cat===cat && n.type==='segment').forEach(n=>{
      n.sx = C.x; n.sy = C.y; n.sz = C.z;
      const ds = links.filter(l=>l.s===n.id && l.rel==='covers').map(l=>byId[l.t]).filter(Boolean);
      if(ds.length){
        let x=0,y=0,z=0;
        ds.forEach(d=>{ x+=d.dir.x; y+=d.dir.y; z+=d.dir.z; });
        const l = Math.hypot(x,y,z) || 1;
        n.lx = x/l*R*1.10; n.ly = y/l*R*1.10; n.lz = z/l*R*1.10;
      } else { n.lx = 0; n.ly = R*1.10; n.lz = 0; }
    });

    // 产物：球外
    nodes.filter(n=>n.cat===cat && n.type==='artifact').forEach(n=>{
      n.sx = C.x; n.sy = C.y; n.sz = C.z;
      const dn = links.filter(l=>l.t===n.id && l.rel==='contains').map(l=>byId[l.s]).find(x=>x && x.dir);
      if(dn){ n.lx = dn.dir.x*R*1.16; n.ly = dn.dir.y*R*1.16; n.lz = dn.dir.z*R*1.16; }
      else { n.lx = 0; n.ly = R*1.16; n.lz = 0; }
    });
  });

  // 桥节点：挂在关联卡片世界坐标的质心，再往中心收
  nodes.filter(n=>n.type==='topic' || n.type==='entity').forEach(n=>{
    const ids = links.filter(l=>l.s===n.id || l.t===n.id).map(l=> l.s===n.id ? l.t : l.s);
    let x=0,y=0,z=0,c=0;
    ids.forEach(id=>{
      const m = byId[id];
      if(!m) return;
      const w = baseWorld(m);
      x += w.x; y += w.y; z += w.z; c++;
    });
    if(c){ x/=c; y/=c; z/=c; } else { x=0; y=0; z=0; }
    n.sx = clamp(x*0.22, -300, 300);
    n.sy = y*0.55;
    n.sz = z*0.55;
    n.bridge = true;
  });

  // 轻微随机抖动：不要完美球壳，点自己散着
  function hashId(str){
    let h = 2166136261;
    for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  nodes.forEach(n=>{
    if(!n.cat) return;
    const h = hashId(n.id);
    n.lx += (((h % 1000)/1000) - 0.5) * 30;
    n.ly += ((((h >>> 10) % 1000)/1000) - 0.5) * 30;
    n.lz += ((((h >>> 20) % 1000)/1000) - 0.5) * 30;
  });

  let maxR = 0;
  nodes.forEach(n=>{
    const w = baseWorld(n);
    maxR = Math.max(maxR, Math.hypot(w.x, w.y, w.z) + n.r*2);
  });
  return maxR;
}

function resize(){

  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';

function fitView(reset){
  const listW = (typeof document !== 'undefined' && document.body.classList.contains('list-open')) ? 360 : 0;
  view.panX = 0; view.panY = 0;
  if(reset){
    view.rot = 0; view.rotX = 0.34;
    sphereSpin.work.rot = 0; sphereSpin.work.rotX = 0;
    sphereSpin.daily.rot = 0; sphereSpin.daily.rotX = 0;
  }
  let sc = 1;
  for(let it=0; it<4; it++){
    let minX=1e9, maxX=-1e9, minY=1e9, maxY=-1e9;
    nodes.forEach(n=>{
      const q = projectNode(n, sc, 0, 0);
      if(q.x < minX) minX = q.x;
      if(q.x > maxX) maxX = q.x;
      if(q.y < minY) minY = q.y;
      if(q.y > maxY) maxY = q.y;
    });
    const bw = Math.max(1, maxX-minX), bh = Math.max(1, maxY-minY);
    const k = Math.min(((W-listW)*0.9)/bw, (H*0.84)/bh);
    sc = sc * k;
  }
  view.scale = sc;
  view.fitScale = sc;

  // 按包围盒中心对齐到可视区域中心（而不是世界原点）
  let minX=1e9, maxX=-1e9, minY=1e9, maxY=-1e9;
  nodes.forEach(n=>{
    const q = projectNode(n, sc, 0, 0);
    if(q.x < minX) minX = q.x;
    if(q.x > maxX) maxX = q.x;
    if(q.y < minY) minY = q.y;
    if(q.y > maxY) maxY = q.y;
  });
  const targetCX = listW + (W - listW)/2;
  const targetCY = H/2;
  view.panX = targetCX - (minX + maxX)/2;
  view.panY = targetCY - (minY + maxY)/2;
}

function randDir(rnd){
  const u = rnd()*2 - 1;
  const th = rnd()*Math.PI*2;
  const r = Math.sqrt(Math.max(0, 1-u*u));
  return { x: r*Math.cos(th), y: u, z: r*Math.sin(th) };
}

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function makeGalaxySprite(seed, col){
  const S = 160;
  const cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  const g = cv.getContext('2d');
  const c = S/2;
  const rnd = mulberry32(seed);

  // 星系盘光晕（倾斜椭圆）
  g.save();
  g.translate(c,c);
  g.rotate(0.55);
  g.scale(1, 0.42);
  const disk = g.createRadialGradient(0,0,0,0,0,70);
  disk.addColorStop(0,'rgba('+col+',0.16)');
  disk.addColorStop(0.55,'rgba('+col+',0.07)');
  disk.addColorStop(1,'rgba('+col+',0)');
  g.fillStyle = disk;
  g.beginPath(); g.arc(0,0,70,0,Math.PI*2); g.fill();
  g.restore();

  // 两条旋臂
  for(let i=0;i<420;i++){
    const t = Math.pow(rnd(), 0.55);
    const arm = i % 2;
    const ang = t*Math.PI*4.5 + arm*Math.PI + rnd()*0.22;
    const rad = 3 + t*64;
    const x = c + Math.cos(ang)*rad;
    const y = c + Math.sin(ang)*rad*0.5;
    g.fillStyle = 'rgba('+col+','+((0.06+0.22*rnd())*(1-t*0.6)).toFixed(3)+')';
    g.fillRect(x, y, 1.4, 1.4);
  }

  // 核心
  const rg = g.createRadialGradient(c,c,0,c,c,30);
  rg.addColorStop(0,'rgba(255,255,255,0.95)');
  rg.addColorStop(0.22,'rgba('+col+',0.6)');
  rg.addColorStop(1,'rgba('+col+',0)');
  g.fillStyle = rg;
  g.beginPath(); g.arc(c,c,30,0,Math.PI*2); g.fill();
  return cv;
}

function makePlanetTexture(kind, seed){
  const Wt = 512, Ht = 256;
  const cv = document.createElement('canvas');
  cv.width = Wt; cv.height = Ht;
  const g = cv.getContext('2d');
  const rnd = mulberry32(seed);

  if(kind === 'gas'){
    const bg = g.createLinearGradient(0,0,0,Ht);
    bg.addColorStop(0,'#2a1c14');
    bg.addColorStop(0.5,'#7a5233');
    bg.addColorStop(1,'#241a12');
    g.fillStyle = bg; g.fillRect(0,0,Wt,Ht);
    const cols = ['#c79a6a','#a8744a','#e0c19a','#8a5a3a','#d9b07f','#6f452b'];
    let yy = 0;
    while(yy < Ht){
      const h = 6 + rnd()*18;
      g.fillStyle = cols[Math.floor(rnd()*cols.length)];
      g.globalAlpha = 0.25 + rnd()*0.35;
      g.beginPath();
      g.moveTo(0, yy);
      for(let x=0;x<=Wt;x+=16) g.lineTo(x, yy + Math.sin(x*0.03 + rnd()*0.2)*3);
      g.lineTo(Wt, yy+h);
      for(let x=Wt;x>=0;x-=16) g.lineTo(x, yy+h + Math.sin(x*0.03)*3);
      g.closePath(); g.fill();
      yy += h;
    }
    g.globalAlpha = 1;
    for(let i=0;i<34;i++){
      g.fillStyle = 'rgba(255,230,200,'+(0.03+rnd()*0.06).toFixed(3)+')';
      g.beginPath();
      g.ellipse(rnd()*Wt, rnd()*Ht, 10+rnd()*40, 3+rnd()*8, 0, 0, 6.28);
      g.fill();
    }
  } else if(kind === 'earth'){

    bg.addColorStop(0,'#0b2a52');
    bg.addColorStop(0.5,'#12508a');
    bg.addColorStop(1,'#0a2547');
    g.fillStyle = bg; g.fillRect(0,0,Wt,Ht);
    for(let i=0;i<110;i++){

      g.beginPath(); g.ellipse(cx,cy,rad,rad*(0.5+rnd()*0.5),rnd()*3,0,6.28); g.fill();
    }
    g.fillStyle = 'rgba(230,245,255,0.8)';
    g.fillRect(0,0,Wt,14); g.fillRect(0,Ht-14,Wt,14);
    for(let i=0;i<46;i++){
      g.fillStyle = 'rgba(255,255,255,'+(0.05+rnd()*0.13).toFixed(3)+')';
      g.beginPath(); g.ellipse(rnd()*Wt, rnd()*Ht, 20+rnd()*50, 4+rnd()*10, rnd()*0.4,0,6.28); g.fill();
    }
  } else {
    const bg = g.createLinearGradient(0,0,0,Ht);
    bg.addColorStop(0,'#c8ecff');
    bg.addColorStop(0.5,'#82bcdc');
    bg.addColorStop(1,'#dff5ff');
    g.fillStyle = bg; g.fillRect(0,0,Wt,Ht);
    for(let i=0;i<70;i++){
      g.strokeStyle = 'rgba(255,255,255,'+(0.10+rnd()*0.3).toFixed(3)+')';
      g.lineWidth = 1 + rnd()*2;
      g.beginPath();
      let x = rnd()*Wt, y = rnd()*Ht;
      g.moveTo(x,y);
      for(let k=0;k<6;k++){ x += (rnd()-0.5)*60; y += (rnd()-0.5)*30; g.lineTo(x,y); }
      g.stroke();
    }
    for(let i=0;i<56;i++){
      g.fillStyle = 'rgba(200,235,255,'+(0.08+rnd()*0.18).toFixed(3)+')';
      g.beginPath(); g.ellipse(rnd()*Wt,rnd()*Ht,10+rnd()*30,4+rnd()*10,0,0,6.28); g.fill();
    }
  }
  return cv;
}

function makeShipSprites(){

function spawnShip(){
  if(!shipSprites) shipSprites = makeShipSprites();
  const edge = Math.floor(Math.random()*4);
  let x, y;
  if(edge===0){ x = -60; y = Math.random()*H; }
  else if(edge===1){ x = W+60; y = Math.random()*H; }
  else if(edge===2){ x = Math.random()*W; y = -60; }
  else { x = Math.random()*W; y = H+60; }
  const tx = W*(0.2 + Math.random()*0.6);
  const ty = H*(0.2 + Math.random()*0.6);
  const ang = Math.atan2(ty-y, tx-x) + (Math.random()-0.5)*0.45;
  const sp = 55 + Math.random()*100;
  BACK.ships.push({
    x:x, y:y,
    vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
    rot: ang,
    size: 16 + Math.random()*14,
    age: 0,
    max: 26,
    v: Math.floor(Math.random()*5),
    a: 0.40 + Math.random()*0.22
  });
  if(BACK.ships.length > 3) BACK.ships.shift();
}

function updateBackdrop(dt){
  for(let i=0;i<BACK.nebulae.length;i++){
    const n = BACK.nebulae[i];
    n.x += n.vx * dt/1000;
    n.y += n.vy * dt/1000;
    if(n.x < -n.r) n.x = W + n.r;
    if(n.x > W + n.r) n.x = -n.r;
    if(n.y < -n.r) n.y = H + n.r;
    if(n.y > H + n.r) n.y = -n.r;
  }
  for(let i=0;i<BACK.planets.length;i++){
    const p = BACK.planets[i];
    p.spin += p.spinSp * dt/1000;
    p.x += p.vx * dt/1000;
    p.y += p.vy * dt/1000;
    const m = p.r*1.6;
    if(p.x < -m) p.x = W + m;
    if(p.x > W + m) p.x = -m;
    if(p.y < -m) p.y = H + m;
    if(p.y > H + m) p.y = -m;
  }
  BACK.nextShip -= dt;
  if(BACK.nextShip <= 0){
    spawnShip();
    BACK.nextShip = 9000 + Math.random()*12000;
  }
  for(let i=BACK.ships.length-1;i>=0;i--){
    const sh = BACK.ships[i];
    sh.age += dt/1000;
    sh.x += sh.vx*dt/1000;
    sh.y += sh.vy*dt/1000;
    if(sh.age > sh.max || sh.x < -160 || sh.x > W+160 || sh.y < -160 || sh.y > H+160){
      BACK.ships.splice(i,1);
    }
  }
}

function drawDistant(now){
  const t = now;
  const fit = view.fitScale || 1;
  const zf = view.scale / fit - 1;
  const px = view.panX * 0.10 + Math.sin(view.rot)*18;
  const py = view.panY * 0.10 + Math.sin(view.rotX)*14;

  function par(obj, d){
    return [
      obj.x + px*d + (obj.x - W/2)*zf*0.075*d,
      obj.y + py*d + (obj.y - H/2)*zf*0.075*d
    ];
  }

  ctx.globalCompositeOperation = 'lighter';

  // 远处星云（缓慢流动）
  for(let i=0;i<BACK.nebulae.length;i++){
    const n = BACK.nebulae[i];
    const xy = par(n, n.d);
    const a = n.a * (0.75 + 0.25*Math.sin(t*0.0004 + n.ph));
    const rg = ctx.createRadialGradient(xy[0],xy[1],0,xy[0],xy[1],n.r);
    rg.addColorStop(0,'rgba('+n.c+','+a.toFixed(3)+')');
    rg.addColorStop(0.55,'rgba('+n.c+','+(a*0.5).toFixed(3)+')');
    rg.addColorStop(1,'rgba('+n.c+',0)');
    ctx.fillStyle = rg;
    ctx.fillRect(xy[0]-n.r, xy[1]-n.r, n.r*2, n.r*2);

    // 内部流动亮丝
    for(let f=0; f<3; f++){
      const ph = n.ph + f*2.6;
      const base = n.ph + f*2.1 + t*0.00005;
      ctx.beginPath();
      for(let k=0;k<=26;k++){
        const u = k/26;
        const ang = base + u*1.7 + Math.sin(t*0.00006 + f*2)*0.12;
        const rad = n.r*(0.22 + u*0.62) + Math.sin(u*6.5 + ph + t*0.00012)*n.r*0.05;
        const fx = xy[0] + Math.cos(ang)*rad;
        const fy = xy[1] + Math.sin(ang)*rad*0.82;
        if(k===0) ctx.moveTo(fx,fy); else ctx.lineTo(fx,fy);
      }
      ctx.strokeStyle = 'rgba(205,225,255,'+(0.06 + 0.035*Math.sin(t*0.0004 + n.ph)).toFixed(3)+')';
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  }

  // 远处星系
  for(let i=0;i<BACK.galaxies.length;i++){
    const g = BACK.galaxies[i];
    const xy = par(g, g.d);
    ctx.save();
    ctx.translate(xy[0], xy[1]);
    ctx.rotate(g.rot + t*0.000012);
    ctx.globalAlpha = g.a * (0.8 + 0.2*Math.sin(t*0.0006 + g.ph));
    const gs = g.size * (1 + zf*0.05*g.d);
    ctx.drawImage(g.sprite, -gs/2, -gs/2, gs, gs);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // 远处行星剪影
  for(let i=0;i<BACK.planets.length;i++){
    drawPlanet(BACK.planets[i], t, zf, par);
  }
}

function drawPlanet(p, t, zf, par){
  const xy = par(p, p.d*0.6);
  const x = xy[0], y = xy[1];
  const r = p.r * (1 + zf*0.05);
  const la = p.light;

  // 外层大气光
  const at = ctx.createRadialGradient(x,y,r*0.92,x,y,r*1.28);
  at.addColorStop(0,'rgba('+p.c+',0)');
  at.addColorStop(0.55,'rgba('+p.c+',0.16)');
  at.addColorStop(1,'rgba('+p.c+',0)');
  ctx.fillStyle = at;
  ctx.beginPath(); ctx.arc(x,y,r*1.28,0,Math.PI*2); ctx.fill();

  // 行星环（背面）
  if(p.ring) drawRing(p, x, y, r, false);

  // 球面贴图（柱面滚动 = 自转）
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.clip();
  const texW = Math.PI*2*r*0.5;
  const off = ((p.spin/(Math.PI*2)) % 1) * texW;
  ctx.globalAlpha = p.a;
  ctx.drawImage(p.tex, x - texW/2 - off, y - r, texW, r*2);
  ctx.drawImage(p.tex, x - texW/2 - off + texW, y - r, texW, r*2);

  // 光照 / 晨昏线
  const lx = x + Math.cos(la)*r*0.62;
  const ly = y + Math.sin(la)*r*0.55;
  const sh = ctx.createRadialGradient(lx,ly,r*0.08, x,y,r*1.42);
  sh.addColorStop(0,'rgba(255,255,255,0.20)');
  sh.addColorStop(0.25,'rgba(255,255,255,0.05)');
  sh.addColorStop(0.50,'rgba(0,0,0,0)');
  sh.addColorStop(0.72,'rgba(0,0,10,0.55)');
  sh.addColorStop(1,'rgba(0,0,8,0.96)');
  ctx.fillStyle = sh;
  ctx.fillRect(x-r, y-r, r*2, r*2);
  ctx.globalAlpha = 1;
  ctx.restore();

  // 边缘光
  const lg = ctx.createLinearGradient(
    x + Math.cos(la)*r, y + Math.sin(la)*r,
    x - Math.cos(la)*r, y - Math.sin(la)*r
  );
  lg.addColorStop(0,'rgba('+p.c+',0.55)');
  lg.addColorStop(0.45,'rgba('+p.c+',0.06)');
  lg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.strokeStyle = lg;
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();

  // 行星环（前半）
  if(p.ring) drawRing(p, x, y, r, true);

  // 卫星公转
  if(p.moon){
    const ma = p.moonPh + t*0.00016;
    const mx = x + Math.cos(ma)*r*2.0;
    const my = y + Math.sin(ma)*r*0.62;
    const mr = Math.max(3, r*0.085);
    const mg = ctx.createRadialGradient(mx-mr*0.4, my-mr*0.4, 0, mx, my, mr);
    mg.addColorStop(0,'rgba(150,160,180,0.9)');
    mg.addColorStop(1,'rgba(20,24,36,0.95)');
    ctx.fillStyle = mg;
    ctx.beginPath(); ctx.arc(mx,my,mr,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'rgba('+p.c+',0.35)'; ctx.lineWidth = 1; ctx.stroke();
  }
}

function drawRing(p, x, y, r, front){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(p.tilt + Math.sin(performance.now()*0.00002)*0.01);
  ctx.scale(1, 0.30);
  const grad = ctx.createLinearGradient(-r*1.6, 0, r*1.6, 0);
  grad.addColorStop(0,'rgba('+p.c+',0.02)');
  grad.addColorStop(0.35,'rgba('+p.c+',0.32)');
  grad.addColorStop(0.6,'rgba('+p.c+',0.16)');
  grad.addColorStop(1,'rgba('+p.c+',0.02)');
  ctx.strokeStyle = grad;
  ctx.lineWidth = Math.max(4, r*0.075);
  ctx.beginPath();
  if(front) ctx.arc(0,0,r*1.5, 0, Math.PI);
  else ctx.arc(0,0,r*1.5, 0, Math.PI*2);
  ctx.stroke();

  ctx.lineWidth = Math.max(1.2, r*0.02);
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.beginPath();
  if(front) ctx.arc(0,0,r*1.34, 0, Math.PI);
  else ctx.arc(0,0,r*1.34, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

function drawShips(now){
  if(!shipSprites) shipSprites = makeShipSprites();
  // 引擎微光（很小、偏暗）
  ctx.globalCompositeOperation = 'lighter';
  for(let i=0;i<BACK.ships.length;i++){
    const sh = BACK.ships[i];
    const ex = sh.x - Math.cos(sh.rot)*sh.size*0.32;
    const ey = sh.y - Math.sin(sh.rot)*sh.size*0.32;
    const rr = sh.size*0.5;
    const rg = ctx.createRadialGradient(ex,ey,0,ex,ey,rr);
    rg.addColorStop(0,'rgba(255,170,80,0.18)');
    rg.addColorStop(0.5,'rgba(110,190,255,0.06)');
    rg.addColorStop(1,'rgba(110,190,255,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(ex-rr, ey-rr, rr*2, rr*2);
  }
  ctx.globalCompositeOperation = 'source-over';

  // 船体（按款式）
  for(let i=0;i<BACK.ships.length;i++){
    const sh = BACK.ships[i];
    const sp = shipSprites[sh.v] || shipSprites[0];
    const w = sh.size, h = w*0.44;
    ctx.save();
    ctx.translate(sh.x, sh.y);
    ctx.rotate(sh.rot);
    ctx.globalAlpha = sh.a;
    ctx.drawImage(sp, -w*0.5, -h*0.5, w, h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function hexA(hex, a){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
const sprites = {};
Object.keys(TYPE).forEach(t=>{
  const c = TYPE[t].color, r = TYPE[t].r;
  const size = Math.ceil(r*6);
  const cv = document.createElement('canvas');

  const g = cv.getContext('2d');

  const rg = g.createRadialGradient(ctr,ctr,0,ctr,ctr,size/2);

  rg.addColorStop(0.42, hexA(c,0.11));
  rg.addColorStop(0.72, hexA(c,0.03));

  g.fillStyle = rg; g.fillRect(0,0,size,size);
  sprites[t] = { cv:cv, r:r };
});

/* ============================================================
   6. 坐标变换（3D 透视投影：把记忆盘倾斜成星系盘）
   ============================================================ */
const CAM = (function(){ return { focal:8400, baseDist:12000 }; })();
/* 节点固定屏幕尺寸：缩放只改变间距，不再把节点/高亮环一起放大 */
const NODE_SIZE = 0.62;

function rotLocal(lx, ly, lz, rot, rotX){
  const R = (rot === undefined) ? view.rot : rot;
  const RX = (rotX === undefined) ? view.rotX : rotX;
  const cosY = Math.cos(R), sinY = Math.sin(R);
  const X1 = lx*cosY - lz*sinY;
  const Z1 = lx*sinY + lz*cosY;
  const cosX = Math.cos(RX), sinX = Math.sin(RX);
  const Y2 = ly*cosX - Z1*sinX;
  const Z2 = ly*sinX + Z1*cosX;
  return { x:X1, y:Y2, z:Z2 };
}
function projectWorld(X, Y, Z, sc, panX, panY){
  const D = CAM.baseDist/sc;
  const p = CAM.focal/(D - Z);
  return { x: cx + panX + X*p, y: cy + panY + Y*p, p:p, z:Z };
}
function nodeSpin(n){
  const sp = (n && n.cat) ? sphereSpin[n.cat] : null;
  return sp
    ? { rot: view.rot + sp.rot, rotX: clamp(view.rotX + sp.rotX, -1.45, 1.45) }
    : { rot: view.rot, rotX: view.rotX };
}
function projectNode(n, sc, panX, panY){
  const R = nodeSpin(n);
  const r = rotLocal(n.lx, n.ly, n.lz, R.rot, R.rotX);
  return projectWorld(n.sx + r.x, n.sy + r.y, n.sz + r.z, sc, panX, panY);
}

let hovered = null, selected = null;
let rotating = false, panning = false;
let mouse = { x:0, y:0, downX:0, downY:0, lastX:0, lastY:0, moved:false };
const hidden = {};

/* ---- 动画状态 ---- */
const ANIM = { cam:null, focusMode:false, saved:null };
const ripples = [];
nodes.forEach(n=>{ n._a = 1; n._k = 0; n._vis = 1; });
links.forEach(l=>{ l._a = 1; });

function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function lerp(a,b,t){ return a + (b-a)*t; }
function easeInOut(t){ return t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }
function easeOut(t){ return 1 - Math.pow(1-t,3); }
function angleLerp(a, b, t){
  let d = (b - a) % (Math.PI*2);
  if(d >  Math.PI) d -= Math.PI*2;
  if(d < -Math.PI) d += Math.PI*2;
  return a + d*t;
}

/* ============================================================
   8. 绘制
   ============================================================ */
let lastT = performance.now();
function frame(){
  const now = performance.now();
  const dt = Math.min(now - lastT, 50); lastT = now;
  updateCam(now);
  if(JOY.x || JOY.y){
    view.panX += JOY.x * dt * 0.32;
    view.panY += JOY.y * dt * 0.32;
    ANIM.cam = null;
  }
  updateNodeAnim(dt);
  updateBackdrop(dt);
  if(view.autoRotate && !rotating && !panning && !hovered && !ANIM.focusMode && !ANIM.cam){
    view.rot += dt * 0.00005;
  }
  draw(now);
  requestAnimationFrame(frame);
}

function updateCam(now){
  const c = ANIM.cam;
  if(!c) return;
  const t = clamp((now - c.t0)/c.dur, 0, 1);
  const e = c.ease(t);
  view.scale = lerp(c.s0, c.s1, e);
  view.panX  = lerp(c.x0, c.x1, e);
  view.panY  = lerp(c.y0, c.y1, e);
  view.rot   = angleLerp(c.r0, c.r1, e);
  view.rotX  = lerp(c.a0, c.a1, e);
  if(t >= 1){
    ANIM.cam = null;
    if(c.onDone) c.onDone();
  }
}

function animateCam(to, dur, opts){
  opts = opts || {};
  ANIM.cam = {
    t0: performance.now(),
    dur: document.body.classList.contains('noanim') ? 1 : (dur || 620),
    s0: view.scale, x0: view.panX, y0: view.panY,
    s1: to.scale, x1: to.panX, y1: to.panY,
    r0: view.rot, a0: view.rotX,
    r1: (to.rot !== undefined ? to.rot : view.rot),
    a1: (to.rotX !== undefined ? to.rotX : view.rotX),
    ease: opts.ease || easeInOut,
    onDone: opts.onDone || null
  };
}

function updateNodeAnim(dt){
  const f = hovered || selected;
  const fid = f ? f.id : null;
  const near = new Set();
  if(f){
    links.forEach(l=>{
      if(l.s===fid) near.add(l.t);
      else if(l.t===fid) near.add(l.s);
    });
  }
  const k = Math.min(1, dt/110);
  const kv = Math.min(1, dt/160);
  for(let i=0;i<nodes.length;i++){
    const n = nodes[i];
    let ta = 1, tk = 0;
    if(f){
      if(n.id===fid){ ta = 1; tk = 1; }
      else if(near.has(n.id)){ ta = 0.95; tk = 0.55; }
      else { ta = selected ? 0.22 : 0.3; tk = 0; }
    }
    if(focusDay && n.type!=='persona'){
      if(n.dayRef !== focusDay) ta = Math.min(ta, 0.10);
      else tk = Math.max(tk, 0.4);
    }
    n._a += (ta - n._a)*k;
    n._k += (tk - n._k)*k;
    const tv = (hidden[n.type] || n._gone || n._fp === false ||
      (neighborOnly && f && n.id !== fid && !near.has(n.id))) ? 0 : 1;
    n._vis += (tv - n._vis)*kv;
  }
  for(let i=0;i<links.length;i++){
    const l = links[i];
    let ta = 1;
    if(f){
      const on = (l.s===fid || l.t===fid);
      ta = on ? 1 : 0.09;
    }
    l._a += (ta - l._a)*k;
  }
  for(let i=ripples.length-1;i>=0;i--){
    if(performance.now() - ripples[i].t0 > 950) ripples.splice(i,1);
  }
}

const SPHERE_R = 415;

function drawTypeGlyph(color, shape, px, py, rad, alpha){
  if(rad < 2 || !shape) return;
  ctx.globalAlpha = Math.max(0.22, alpha*0.85);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  if(shape === 'ring'){
    ctx.arc(px, py, rad*1.15, 0, Math.PI*2);
  } else if(shape === 'diamond'){
    ctx.moveTo(px, py-rad); ctx.lineTo(px+rad, py); ctx.lineTo(px, py+rad); ctx.lineTo(px-rad, py); ctx.closePath();
  } else if(shape === 'square'){
    ctx.rect(px-rad, py-rad, rad*2, rad*2);
  } else {
    ctx.arc(px, py, rad*0.85, 0, Math.PI*2);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function draw(now){
  const t = now;
  const R0 = SPHERE_R;
  if(bg) ctx.drawImage(bg,0,0,W,H);

  if(!LITE) drawDistant(t);

  // 屏幕星空
  const zfS = view.scale/(view.fitScale||1) - 1;
  for(let i=0;i<stars.length;i++){
    const s = stars[i];
    const a = s.a * (0.55 + 0.45*Math.sin(t*0.0012 + s.p));
    const sx = s.x + view.panX*0.16*s.d + (s.x - W/2)*zfS*0.09*s.d;
    const sy = s.y + view.panY*0.16*s.d + (s.y - H/2)*zfS*0.09*s.d;
    ctx.fillStyle = 'rgba(190,210,255,'+a.toFixed(3)+')';
    ctx.fillRect(sx, sy, s.r, s.r);
  }

  if(!LITE) drawShips(t);

  // 每帧投影一次
  for(let i=0;i<nodes.length;i++){
    const n = nodes[i];
    const q = projectNode(n, view.scale, view.panX, view.panY);
    n._sx = q.x; n._sy = q.y; n._pp = q.p; n._pz = q.z;
    n._sr = n.r * q.p;
  }

  // 星云团
  ctx.globalCompositeOperation = 'lighter';
  for(let i=0;i<puffs.length && !LITE;i++){
    const pf = puffs[i];
    const q = projectWorld(pf.x, pf.y, pf.z, view.scale, view.panX, view.panY);
    const sr = pf.size * q.p;
    if(q.x < -sr || q.x > W+sr || q.y < -sr || q.y > H+sr) continue;
    const rg = ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,sr);
    rg.addColorStop(0,'rgba('+pf.c+','+pf.a+')');
    rg.addColorStop(0.55,'rgba('+pf.c+','+(pf.a*0.45).toFixed(3)+')');
    rg.addColorStop(1,'rgba('+pf.c+',0)');
    ctx.fillStyle = rg; ctx.fillRect(q.x-sr,q.y-sr,sr*2,sr*2);
  }
  ctx.globalCompositeOperation = 'source-over';

  // 旋臂尘埃
  for(let i=0;i<dust.length && !LITE;i++){
    const d = dust[i];
    const q = projectWorld(d.x, d.y, d.z, view.scale, view.panX, view.panY);
    if(q.x<-30||q.x>W+30||q.y<-30||q.y>H+30) continue;
    const al = d.a * (0.55 + 0.45*Math.sin(t*0.0009 + d.p)) * clamp(q.p,0.5,1.3);
    ctx.fillStyle = 'rgba('+d.c+','+al.toFixed(3)+')';
    ctx.fillRect(q.x, q.y, d.s, d.s);
  }

  // 球面点云（细小、不发光、不叠加雾化）
  for(let i=0;i<surface.length && !LITE;i++){
    const d = surface[i];
    const l = rotLocal(d.lx, d.ly, d.lz);
    const q = projectWorld(d.cx + l.x, l.y, l.z, view.scale, view.panX, view.panY);
    if(q.x < -10 || q.x > W+10 || q.y < -10 || q.y > H+10) continue;
    const dt2 = clamp((q.z + R0)/(2*R0), 0, 1);
    const al = d.a * (0.25 + 0.75*dt2);
    ctx.fillStyle = 'rgba('+d.c+','+al.toFixed(3)+')';
    ctx.fillRect(q.x, q.y, d.s, d.s);
  }

  // 中央人格辉光（只保留一个，避免球内发雾）
  ctx.globalCompositeOperation = 'lighter';
  {
    const q = projectWorld(0, 0, 0, view.scale, view.panX, view.panY);
    const rr = Math.max(90, 120*q.p);
    const rg = ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,rr);
    rg.addColorStop(0,'rgba(255,214,120,0.12)');
    rg.addColorStop(0.45,'rgba(255,200,110,0.04)');
    rg.addColorStop(1,'rgba(255,200,110,0)');
    ctx.fillStyle = rg; ctx.fillRect(q.x-rr,q.y-rr,rr*2,rr*2);
  }
  ctx.globalCompositeOperation = 'source-over';

  // 日期星团光晕
  ctx.globalCompositeOperation = 'lighter';
  for(let i=0;i<nodes.length;i++){
    const n = nodes[i];
    if(n.type!=='day' || n._vis < 0.05) continue;
    const rr = 88*n._pp;
    const rg = ctx.createRadialGradient(n._sx,n._sy,0,n._sx,n._sy,rr);
    rg.addColorStop(0,'rgba(120,145,220,0.038)');
    rg.addColorStop(0.6,'rgba(100,120,200,0.014)');
    rg.addColorStop(1,'rgba(100,120,200,0)');
    ctx.fillStyle = rg; ctx.fillRect(n._sx-rr,n._sy-rr,rr*2,rr*2);
  }
  ctx.globalCompositeOperation = 'source-over';

  // 分类标签
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ['work','daily'].forEach(cat=>{
    const C = SPHERE[cat];
    const q = projectWorld(C.x, 0, 0, view.scale, view.panX, view.panY);
    const rr = C.r * q.p;
    ctx.font = '600 13px -apple-system,"PingFang SC",sans-serif';
    ctx.fillStyle = cat==='work' ? 'rgba(150,195,255,0.82)' : 'rgba(130,232,198,0.82)';
    ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 8;
    ctx.fillText(cat==='work' ? '工作' : '日常', q.x, q.y - rr - 10);
    ctx.shadowBlur = 0;
  });

  // 连线（按深度排序，近的后画）
  ctx.lineCap = 'round';
  const ld = [];
  const focusNow = hovered || selected;
  for(let i=0;i<links.length;i++){
    const l = links[i];
    const a = byId[l.s], b = byId[l.t];
    if(!a || !b) continue;
    // 静置时只画「日期→任务」的骨架线（很淡），形成分子网结构感；聚焦时画关联线
    if(!focusNow && l.rel !== 'contains') continue;
    const vis = Math.min(a._vis, b._vis);
    if(vis < 0.02) continue;
    let alpha = focusNow ? 0.19 : 0.06;
    if(l.rel==='supersedes') alpha = 0.66;
    else if(l.rel==='reminds') alpha = 0.4;
    else if(l.rel==='related') alpha = 0.22;
    else if(l.rel==='due') alpha = 0.3;
    else if(l.rel==='produced') alpha = 0.28;
    else if(l.rel==='evidence') alpha = 0.2;
    else if(l.rel==='covers') alpha = 0.12;
    else if(l.rel==='mentions') alpha = 0.115;
    else if(l.rel==='next') alpha = 0.22;
    else if(l.rel==='contains') alpha = 0.15;
    else if(l.rel==='sameDay') alpha = 0.28;
    const tz = clamp(((a._pz + b._pz)/2 + R0)/(2*R0), 0, 1);
    alpha *= l._a * vis * (0.26 + 0.74*tz);
    if(alpha < (focusNow ? 0.008 : 0.004)) continue;
    ld.push({ l:l, a:a, b:b, alpha:alpha, z:(a._pz + b._pz)/2 });
  }
  ld.sort((x,y)=> x.z - y.z);

  for(let i=0;i<ld.length;i++){
    const it = ld[i], l = it.l, a = it.a, b = it.b, alpha = it.alpha;
    const sx1 = a._sx, sy1 = a._sy, sx2 = b._sx, sy2 = b._sy;
    if((sx1<-90&&sx2<-90)||(sx1>W+90&&sx2>W+90)||(sy1<-90&&sy2<-90)||(sy1>H+90&&sy2>H+90)) continue;
    const mx = (sx1+sx2)/2, my = (sy1+sy2)/2;
    const dx = sx2-sx1, dy = sy2-sy1;
    const len = Math.hypot(dx,dy) || 1;
    const bend = ((linkIndex(l))%10)/10 * 0.22 + 0.04;
    const cpx = mx - dy/len * len * bend * 0.5;
    const cpy = my + dx/len * len * bend * 0.5;

    ctx.beginPath();
    ctx.moveTo(sx1,sy1);
    ctx.quadraticCurveTo(cpx,cpy,sx2,sy2);
    if(l.rel==='supersedes' || l.rel==='next' || l.rel==='sameDay') ctx.setLineDash([3,6]); else ctx.setLineDash([]);
    ctx.strokeStyle = l.rel==='supersedes' ? 'rgba(255,120,120,'+alpha+')'
      : l.rel==='reminds' ? 'rgba(255,140,140,'+alpha+')'
      : l.rel==='related' ? 'rgba(60,220,200,'+alpha+')'
      : l.rel==='due' ? 'rgba(255,150,150,'+alpha+')'
      : l.rel==='produced' ? 'rgba(250,200,90,'+alpha+')'
      : l.rel==='covers' ? 'rgba(110,160,255,'+alpha+')'
      : l.rel==='next' ? 'rgba(150,190,255,'+alpha+')'
      : l.rel==='sameDay' ? 'rgba(140,220,255,'+alpha+')'
      : 'rgba(150,175,235,'+alpha+')';
    ctx.lineWidth = (l.rel==='supersedes' ? 1.4 : 1) * clamp(a._pp,0.7,1.3);
    ctx.stroke();
    l._g = { x1:sx1,y1:sy1,cx:cpx,cy:cpy,x2:sx2,y2:sy2, p:(a._pp+b._pp)/2 };
  }
  ctx.setLineDash([]);

  // 沿连线流光
  ctx.globalCompositeOperation = 'lighter';
  for(let i=0;i<links.length && !LITE;i+=6){
    const l = links[i]; if(!l._g) continue;
    const g = l._g;
    const tt = ((now*0.00013 + i*0.171) % 1);
    const u = 1-tt;
    const px = u*u*g.x1 + 2*u*tt*g.cx + tt*tt*g.x2;
    const py = u*u*g.y1 + 2*u*tt*g.cy + tt*tt*g.y2;
    const col = l.rel==='supersedes' ? '255,120,120'
      : l.rel==='reminds' ? '255,150,150'
      : l.rel==='related' ? '60,230,205'
      : l.rel==='mentions' ? '120,200,255'
      : '190,205,255';
    const rr = 5*clamp(g.p,0.7,1.4);
    const rg = ctx.createRadialGradient(px,py,0,px,py,rr);
    rg.addColorStop(0,'rgba('+col+',0.30)');
    rg.addColorStop(1,'rgba('+col+',0)');
    ctx.fillStyle = rg;
    ctx.fillRect(px-rr,py-rr,rr*2,rr*2);
  }
  ctx.globalCompositeOperation = 'source-over';

  // 节点（远 -> 近）
  const list = nodes.filter(n=> n._vis > 0.02).sort((a,b)=> a._pz - b._pz);
  const focusN = selected || hovered;
  const focusId = focusN ? focusN.id : null;
  const nearIds = new Set();
  if(focusId){
    links.forEach(l=>{
      if(l.s === focusId) nearIds.add(l.t);
      else if(l.t === focusId) nearIds.add(l.s);
    });
  }
  for(let i=0;i<list.length;i++){
    const n = list[i];
    const def = TYPE[n.type];
    const spr = sprites[n.type];
    const pulse = (n.type==='commitment' && n.status==='pending')
      ? 1 + 0.06*Math.sin(t*0.004 + (n.y||0)*0.01) : 1;
    let ns = n.r * (1 + 0.45*n._k) * pulse;
    n._sr = ns * NODE_SIZE;

    const px = n._sx, py = n._sy;
    if(px < -120 || px > W+120 || py < -120 || py > H+120) continue;

    const nt = clamp((n._pz + R0)/(2*R0), 0, 1);
    // 背面（_pz<0）明显更暗更小，缓解正反面重叠分不清
    const depthA = 0.05 + 0.95*Math.pow(nt, 1.35);
    const alpha = n._a * n._vis * depthA;
    ns *= 0.84 + 0.16*nt;
    n._sr = ns * NODE_SIZE;
    const size = 6*n._sr;
    const isBig = n.type==='persona' || n.type==='profile' || n.type==='commitment' || n.type==='day' || n.type==='artifact';
    ctx.globalAlpha = alpha;
    ctx.globalCompositeOperation = 'lighter';
    if(isBig){
      const hs = size*2.2;
      ctx.globalAlpha = alpha*0.07;
      ctx.drawImage(spr.cv, px - hs/2, py - hs/2, hs, hs);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = alpha*0.9;
    ctx.drawImage(spr.cv, px - size/2, py - size/2, size, size);
    ctx.globalAlpha = alpha;
    const glyphShape = n.type==='commitment' ? 'ring'
      : (n.type==='card' ? ({ decision:'diamond', event:'square', fact:'circle' }[n.cardType] || null) : null);
    const glyphRad = n._sr*0.66;
    const isNearNode = focusId && nearIds.has(n.id);
    const glyphFocus = (n === selected) || (hovered === n) || isNearNode;
    if(glyphShape && glyphFocus){
      drawTypeGlyph(def.color, glyphShape, px, py, Math.max(2.8, glyphRad), alpha*0.8);
    }

    // 选中/关联高亮环
    if(n === selected){
      ctx.globalAlpha = 0.92;
      ctx.beginPath(); ctx.arc(px, py, Math.max(n._sr*1.9, 9), 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(255,255,255,0.92)'; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.beginPath(); ctx.arc(px, py, Math.max(n._sr*1.35, 7), 0, Math.PI*2);
      ctx.strokeStyle = hexA(def.color, 0.9); ctx.lineWidth = 1.2; ctx.stroke();
      ctx.globalAlpha = 1;
    } else if(isNearNode && (n.type==='card' || n.type==='commitment' || n.type==='day')){
      ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.arc(px, py, Math.max(n._sr*1.5, 7), 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(175,215,255,0.75)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.globalAlpha = 1;
    }

    if(n.type==='commitment' && n.status!=='pending'){
      ctx.beginPath();
      ctx.arc(px,py,Math.max(n._sr*0.9,4),0,Math.PI*2);
      ctx.strokeStyle = n.status==='done' ? 'rgba(110,231,183,0.5)' : 'rgba(150,160,190,0.35)';
      ctx.lineWidth = 1; ctx.stroke();
    }
    if(n === selected){
      ctx.beginPath();
      ctx.arc(px,py,Math.max(n._sr*1.9,8),0,Math.PI*2);
      ctx.strokeStyle = hexA(def.color,0.65);
      ctx.lineWidth = 1.2; ctx.stroke();
      ctx.beginPath();
      ctx.arc(px,py,Math.max(n._sr*2.6,11),0,Math.PI*2);
      ctx.strokeStyle = hexA(def.color,0.18);
      ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // 点击涟漪
  for(let i=0;i<ripples.length;i++){
    const r = ripples[i];
    const age = (t - r.t0)/950;
    if(age < 0 || age > 1) continue;
    const q = projectWorld(r.x, r.y, r.z, view.scale, view.panX, view.panY);
    ctx.beginPath();
    ctx.arc(q.x, q.y, (10 + age*80)*q.p, 0, Math.PI*2);
    ctx.strokeStyle = hexA(r.color, (1-age)*0.5);
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }

  // 柔光：统一压低场景曝光（标签绘制在其后，保持清晰）
  if(EXPOSURE < 0.999){
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(4,6,14,' + (1 - EXPOSURE).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  // 标签（LOD + 屏幕空间避让）
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const occ = []; let shownLabels = 0;
  for(let i=0;i<list.length;i++){
    const n = list[i];
    if(n._vis < 0.05) continue;
    const isFocus = n===hovered || n===selected;
    const isNear = Boolean(focusId) && nearIds.has(n.id);
    // 选中/关联高亮环画在柔光遮罩之后，保证足够醒目
    if(n === selected){
      const pl = 1 + 0.055*Math.sin(t*0.005);
      ctx.globalAlpha = 0.95;
      ctx.beginPath(); ctx.arc(n._sx, n._sy, Math.max(n._sr*1.9*pl, 10), 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.arc(n._sx, n._sy, Math.max(n._sr*1.35*pl, 7), 0, Math.PI*2);
      ctx.strokeStyle = hexA(TYPE[n.type].color, 0.95); ctx.lineWidth = 1.4; ctx.stroke();
      ctx.beginPath(); ctx.arc(n._sx, n._sy, Math.max(n._sr*2.7*pl, 13), 0, Math.PI*2);
      ctx.strokeStyle = hexA(TYPE[n.type].color, 0.25); ctx.lineWidth = 2.4; ctx.stroke();
      ctx.globalAlpha = 1;
    } else if(isNear && (n.type==='card' || n.type==='commitment' || n.type==='day')){
      ctx.globalAlpha = 0.7;
      ctx.beginPath(); ctx.arc(n._sx, n._sy, Math.max(n._sr*1.5, 7), 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(190,220,255,0.8)'; ctx.lineWidth = 1.1; ctx.stroke();
      ctx.globalAlpha = 1;
    }
    const zr = view.scale / (view.fitScale || 1);
    let show = isFocus || isNear || n.type==='persona';
    if(!show){
      if(n.type==='day') show = true;
      else if(n.type==='commitment') show = zr > 1.25;
      else if(n.type==='profile') show = zr > 0.9;
      else if(n.type==='artifact' || n.type==='segment') show = zr > 1.6;
      else if(n.type==='topic' || n.type==='entity') show = zr > 1.9;
      else if(n.type==='card') show = zr > 2.6;
    }
    if(selected){
      const dsel = Math.hypot(n._sx - selected._sx, n._sy - selected._sy);
      const withinSel = dsel < 260;
      if(!isFocus && !isNear && !withinSel && n.type !== 'persona') continue;
      show = true;
    } else if(!show){
      continue;
    }
    const lt = clamp((n._pz + R0)/(2*R0), 0, 1);
    if(!isFocus && !isNear && lt < 0.5) continue;
    const ly = n._sy + Math.max(n._sr,3) + 7;
    ctx.globalAlpha = Math.max(0.25, n._a) * n._vis * (0.55 + 0.45*lt);
    ctx.font = (n===selected) ? '600 14px -apple-system,"PingFang SC",sans-serif'
      : (isFocus ? '600 13px -apple-system,"PingFang SC",sans-serif'
        : (isNear ? '600 11.5px -apple-system,"PingFang SC",sans-serif'
                  : '11px -apple-system,"PingFang SC",sans-serif'));
    const tw = ctx.measureText(n.label).width;
    let overlap = false;
    for(let k=0;k<occ.length;k++){
      const o = occ[k];
      if(Math.abs(o.x - n._sx) < (o.w + tw)/2 + 4 && Math.abs(o.y - ly) < 13){ overlap = true; break; }
    }
    if(overlap || shownLabels >= (selected ? 28 : 34)) continue;
    occ.push({ x:n._sx, y:ly, w:tw }); shownLabels++;
    ctx.fillStyle = isFocus ? '#ffffff' : (isNear ? '#dbe8ff'
      : (n.type==='day' ? 'rgba(215,226,250,.82)' : 'rgba(225,233,252,.90)'));
    ctx.shadowColor = 'rgba(0,0,0,.95)'; ctx.shadowBlur = isFocus ? 8 : 6;
    ctx.fillText(n.label, n._sx, ly);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
}

function linkIndex(l){ return links.indexOf(l); }

/* ============================================================
   9. 交互
   ============================================================ */
function hitTest(x,y){
  // 收集所有命中候选，再按「正面优先」裁决：
  // 光标落点附近若同时压着正/背面节点，取深度更大（更靠前）的那个；
  // 若最前面的节点离光标明显更远（超过它的命中半径），则仍以距离近者为准，避免远处前排抢点击。
  const cand = [];
  for(let i=0;i<nodes.length;i++){
    const n = nodes[i];
    if(n._vis < 0.3 || n._sx === undefined) continue;
    const d = Math.hypot(x - n._sx, y - n._sy);
    const lim = Math.max(n._sr*1.9, 13);
    if(d < lim) cand.push({ n:n, d:d });
  }
  if(!cand.length) return null;
  let nearest = cand[0];
  for(let i=1;i<cand.length;i++) if(cand[i].d < nearest.d) nearest = cand[i];
  let front = cand[0];
  for(let i=1;i<cand.length;i++) if(cand[i].n._pz > front.n._pz) front = cand[i];
  const tol = Math.max(12, front.n._sr * 1.1);
  if(front.d - nearest.d <= tol) return front.n;   // 重叠/邻近 → 正面优先
  return nearest.n;
}

function sphereAt(sx, sy){
  for(let i=0;i<2;i++){
    const cat = i===0 ? 'work' : 'daily';
    const C = SPHERE[cat];
    const q = projectWorld(C.x, 0, 0, view.scale, view.panX, view.panY);
    const rr = C.r * q.p * 1.05;
    if(Math.hypot(sx - q.x, sy - q.y) < rr) return cat;
  }
  return null;
}
function overSphere(sx, sy){ return Boolean(sphereAt(sx, sy)); }

let rotTarget = null;
canvas.addEventListener('mousedown', e=>{
  ANIM.cam = null;
  // 画布拖拽只旋转球体；平移交给左下方向拖动器
  rotating = true;
  panning = false;
  rotTarget = sphereAt(e.clientX, e.clientY);
  mouse.downX = e.clientX; mouse.downY = e.clientY;
  mouse.lastX = e.clientX; mouse.lastY = e.clientY;
  mouse.moved = false;
  canvas.classList.add('dragging');
});
window.addEventListener('mousemove', e=>{
  mouse.x = e.clientX; mouse.y = e.clientY;
  if(rotating || panning){
    if(Math.abs(e.clientX - mouse.downX) + Math.abs(e.clientY - mouse.downY) > 3) mouse.moved = true;
    if(mouse.moved){
      const dx = e.clientX - mouse.lastX;
      const dy = e.clientY - mouse.lastY;
      if(rotating){
        if(rotTarget && sphereSpin[rotTarget]){
          sphereSpin[rotTarget].rot  += dx * 0.006;
          sphereSpin[rotTarget].rotX = clamp(sphereSpin[rotTarget].rotX + dy * 0.006, -1.45, 1.45);
        } else {
          view.rot  += dx * 0.006;
          view.rotX = clamp(view.rotX + dy * 0.006, -1.45, 1.45);
        }
      } else {
        view.panX += dx;
        view.panY += dy;
      }
      mouse.lastX = e.clientX; mouse.lastY = e.clientY;
    }
    return;
  }
  const n = hitTest(e.clientX, e.clientY);
  if(n !== hovered){
    hovered = n;
    canvas.classList.toggle('pointer', !!n);
  }
});
window.addEventListener('mouseup', e=>{
  const clicked = !mouse.moved;
  rotating = false;
  panning = false;
  rotTarget = null;
  canvas.classList.remove('dragging');
  mouse.downX = 0; mouse.downY = 0;
  if(clicked){
    const n = hitTest(e.clientX, e.clientY);
    if(n) openNode(n);
    else if(ANIM.focusMode) closePanel();
  }
});

canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  ANIM.cam = null;
  const factor = Math.exp(-e.deltaY * 0.0012);
  view.scale = clamp(view.scale * factor, 0.15, 5);
}, { passive:false });

canvas.addEventListener('dblclick', e=>{
  const n = hitTest(e.clientX, e.clientY);
  if(n) openNode(n, { zoom: 4.4 });
});

const panel = document.getElementById('panel');

function visibleCenterX(){
  const listW = (document.body.classList.contains('list-open') ? 360 : 0);
  const panelW = 396;
  return Math.max(180, (listW + (W - panelW))/2);
}

function openNode(n, opts){
  opts = opts || {};
  if(!ANIM.focusMode){
    ANIM.saved = { scale: view.scale, panX: view.panX, panY: view.panY, rot: view.rot, rotX: view.rotX };
    ANIM.focusMode = true;
  }
  selected = n;
  if(n.cat && sphereSpin[n.cat]){ sphereSpin[n.cat].rot = 0; sphereSpin[n.cat].rotX = 0; }
  const bw = baseWorld(n);
  ripples.push({ x:bw.x, y:bw.y, z:bw.z, t0: performance.now(), color: TYPE[n.type].color });

  const panelW = 396;
  const targetCX = visibleCenterX();
  const targetScale = clamp(
    Math.max(view.scale, view.fitScale*2.6, opts.zoom || 0),
    view.fitScale*1.3, 5.6
  );
  const L = Math.hypot(n.lx, n.ly, n.lz);
  const rxy = Math.hypot(n.lx, n.lz) || 0.0001;
  const targetRot  = L > 1 ? Math.atan2(n.lx, n.lz) : view.rot;
  const targetRotX = L > 1 ? Math.atan2(n.ly, rxy) : view.rotX;
  // 用目标旋转/缩放精确投影节点，反推 pan，保证节点落在可视区中心
  const loc = rotLocal(n.lx, n.ly, n.lz, targetRot, targetRotX);
  const q0 = projectWorld(n.sx + loc.x, n.sy + loc.y, n.sz + loc.z, targetScale, 0, 0);
  const already = panel.classList.contains('open');
  if(already) renderPanel(n);

  animateCam({
    scale: targetScale,
    rot: targetRot,
    rotX: targetRotX,
    panX: targetCX - q0.x,
    panY: cy - q0.y
  }, 900, {
    onDone: function(){
      if(selected !== n) return;
      if(opts.locateOnly) return;
      if(!panel.classList.contains('open')){
        renderPanel(n);
        panel.classList.add('open');
      }
    }
  });
}

function closePanel(){
  panel.classList.remove('open');
  selected = null;
  if(ANIM.focusMode){
    ANIM.focusMode = false;
    const sv = ANIM.saved;
    ANIM.saved = null;
    if(sv) animateCam({ scale:sv.scale, panX:sv.panX, panY:sv.panY, rot:sv.rot, rotX:sv.rotX }, 720);
  }
}

function centerCurrent(){
  if(!selected) return;
  const targetCX = visibleCenterX();
  const n = selected;
  const L = Math.hypot(n.lx, n.ly, n.lz);
  const rxy = Math.hypot(n.lx, n.lz) || 0.0001;
  const worldZ = n.sz + L;
  const p = CAM.focal / (CAM.baseDist/view.scale - worldZ);
  animateCam({
    scale: view.scale,
    rot: L > 1 ? Math.atan2(n.lx, n.lz) : view.rot,
    rotX: L > 1 ? Math.atan2(n.ly, rxy) : view.rotX,
    panX: targetCX - cx - n.sx*p,
    panY: 0 - n.sy*p
  }, 620);
}

const SERVED = /^https?:$/.test(location.protocol);
const WRITABLE_ID = /^(c_|ac_)/;
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function cardTarget(n){
  if(!n || !n.cardId) return null;
  return WRITABLE_ID.test(n.cardId) ? n.cardId : null;
}
function sourceLabel(s){
  if(!s) return '';
  const kind = s.kind || s.agent || '';
  const proj = s.project ? String(s.project).split('/').filter(Boolean).pop() : '';
  const turn = s.turn ? String(s.turn).slice(-10) : '';
  return [kind, proj, turn].filter(Boolean).join(' · ');
}
function sendFeedback(action, target){
  return fetch('/feedback', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ action:action, target:target, agent:'galaxy-ui' })
  }).then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
    .then(function(res){
      if(!res.ok) throw new Error((res.j && res.j.error && res.j.error.message) || '请求失败');
      return res.j;
    });
}

function renderPanel(n){

  const meta = document.getElementById('pMeta');

  if(isCardNode){
    rows['来源'] = n.source ? (esc(sourceLabel(n.source)) || '—') : '—';

    } else {

  if(n.status){

    meta.appendChild(row);
  });

  const rel = [];

    if(l.s===n.id) rel.push({ id:l.t, rel:l.rel });

  });
  document.getElementById('pCount').textContent = rel.length ? '('+rel.length+')' : '(0)';

    d.addEventListener('click', ()=>{ openNode(m); });
    box.appendChild(d);
  });

  const rawTarget = n.cardId || null;
  const target = cardTarget(n);
  const why = !SERVED ? '需通过 memoryd 打开页面才能写回'
    : (rawTarget && !target) ? '种子卡暂不支持写回'
    : (!rawTarget ? '该节点不支持写回' : '');

  btnPin.style.display = rawTarget ? 'block' : 'none';
  btnPin.textContent = n.pinned ? '已置顶' : '置顶';
  btnPin.disabled = !canWrite || Boolean(n.pinned);
  btnForget.style.display = rawTarget ? 'block' : 'none';
  btnForget.disabled = !canWrite;
  const btnNear = document.getElementById('pNear');
  if(btnNear) btnNear.classList.toggle('on', neighborOnly);
  [btnDone, btnPin, btnForget].forEach(function(b){ b.title = why || ''; });

/* ---------- P1-4：过滤器（项目/分类/类型/时间），作用于卡片与承诺节点 ---------- */
const FILTER_KEY = 'galaxy.filters.v1';
const filters = { proj:new Set(), cat:new Set(), type:new Set(), days:null };
try{
  const saved = JSON.parse(localStorage.getItem(FILTER_KEY) || 'null');
  if(saved && typeof saved === 'object'){
    (saved.proj||[]).forEach(v=>filters.proj.add(v));
    (saved.cat||[]).forEach(v=>filters.cat.add(v));
    (saved.type||[]).forEach(v=>filters.type.add(v));
    filters.days = saved.days || null;
  }
}catch(e){}
function saveFilters(){
  try{ localStorage.setItem(FILTER_KEY, JSON.stringify({ proj:[...filters.proj], cat:[...filters.cat], type:[...filters.type], days:filters.days })); }catch(e){}
}
function daysAgoCutoff(n){
  const d = new Date(); d.setDate(d.getDate() - (n - 1));
  const p = x => String(x).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function nodePasses(n){
  if(n.type !== 'card' && n.type !== 'commitment') return true;
  if(filters.proj.size && !filters.proj.has(n.project || '其他')) return false;
  if(filters.cat.size && !filters.cat.has(n.cat || 'work')) return false;
  if(filters.type.size && n.type === 'card' && !filters.type.has(n.cardType)) return false;
  if(filters.days){
    const day = n.dayRef;
    if(day && day < daysAgoCutoff(filters.days)) return false;
  }
  return true;
}
function applyFilters(){
  nodes.forEach(n=>{ n._fp = nodePasses(n); });
  const active = filters.proj.size + filters.cat.size + filters.type.size + (filters.days ? 1 : 0);
  const btn = document.getElementById('btnFilter');
  if(btn){ btn.classList.toggle('on', active > 0); btn.textContent = active ? '筛选(' + active + ')' : '筛选'; }
  return active;
}
function toggleFilter(group, val){
  if(group === 'days') filters.days = (filters.days === val ? null : val);
  else {
    const set = filters[group];
    if(!set) return;
    if(set.has(val)) set.delete(val); else set.add(val);
  }
  saveFilters(); applyFilters(); renderList(); refreshStats();
}
function buildFilterChips(){
  const hosts = {
    proj: document.getElementById('fpProj'),
    cat: document.getElementById('fpCat'),
    type: document.getElementById('fpType'),
    days: document.getElementById('fpDays')
  };
  if(!hosts.proj) return;
  const projCount = {}, catCount = {}, typeCount = {};
  nodes.forEach(n=>{
    if(n.type !== 'card' && n.type !== 'commitment') return;
    const p = n.project || '其他'; projCount[p] = (projCount[p]||0) + 1;
    const c = n.cat || 'work'; catCount[c] = (catCount[c]||0) + 1;
    if(n.type === 'card' && n.cardType) typeCount[n.cardType] = (typeCount[n.cardType]||0) + 1;
  });
  const mk = (host, group, val, label, count, on)=>{
    const b = document.createElement('button');
    b.className = 'chip-filter' + (on ? ' on' : '');
    b.textContent = label + (count != null ? ' ' + count : '');
    b.addEventListener('click', ()=> toggleFilter(group, val));
    host.appendChild(b);
  };
  hosts.proj.innerHTML = ''; hosts.cat.innerHTML = ''; hosts.type.innerHTML = ''; hosts.days.innerHTML = '';
  Object.keys(projCount).sort((a,b)=>projCount[b]-projCount[a])
    .forEach(p=> mk(hosts.proj, 'proj', p, p, projCount[p], filters.proj.has(p)));
  Object.keys(catCount)
    .forEach(c=> mk(hosts.cat, 'cat', c, c === 'daily' ? '日常' : '工作', catCount[c], filters.cat.has(c)));
  const TYPE_NAMES = { decision:'决定', preference:'偏好', correction:'更正', event:'事件' };
  Object.keys(typeCount)
    .forEach(t=> mk(hosts.type, 'type', t, TYPE_NAMES[t] || t, typeCount[t], filters.type.has(t)));
  [{v:3,label:'近 3 天'},{v:7,label:'近 7 天'},{v:30,label:'近 30 天'}]
    .forEach(o=> mk(hosts.days, 'days', o.v, o.label, null, filters.days === o.v));
  const cnt = document.getElementById('fpCount');
  if(cnt){ const active = filters.proj.size + filters.cat.size + filters.type.size + (filters.days ? 1 : 0); cnt.textContent = active ? ('已启用 ' + active + ' 组筛选') : '未筛选'; }
}

}

/* ---------- 方向拖动器（下方）：拖动平移视角 ---------- */
const joyEl = document.getElementById('joy');
const joyKnob = document.getElementById('joyKnob');
const JOY = { x:0, y:0, active:false };
function joyMove(cx, cy){
  const r = joyEl.getBoundingClientRect();
  let nx = (cx - (r.left + r.width/2)) / Math.max(1, r.width/2 - 10);
  let ny = (cy - (r.top + r.height/2)) / Math.max(1, r.height/2 - 10);
  const len = Math.hypot(nx, ny);
  if(len > 1){ nx /= len; ny /= len; }
  JOY.x = nx; JOY.y = ny;
  joyKnob.style.transform = 'translate(' + (nx*24).toFixed(1) + 'px,' + (ny*24).toFixed(1) + 'px)';
}
function joyEnd(){
  if(!JOY.active) return;
  JOY.active = false; JOY.x = 0; JOY.y = 0;
  joyEl.classList.remove('dragging');
  joyKnob.style.transform = 'translate(0,0)';
}
if(joyEl){
  joyEl.addEventListener('pointerdown', function(e){
    JOY.active = true;
    joyEl.classList.add('dragging');
    try{ if(joyEl.setPointerCapture) joyEl.setPointerCapture(e.pointerId); }catch(err){}
    joyMove(e.clientX, e.clientY);
    e.preventDefault();
  });
  joyEl.addEventListener('pointermove', function(e){ if(JOY.active) joyMove(e.clientX, e.clientY); });
  joyEl.addEventListener('pointerup', joyEnd);

/* ---------- 搜索（P1-3：接 /recall，失败/离线回退本地子串） ---------- */
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('searchResults');
let srTimer = null, srSeq = 0, srItems = [], srActive = -1;

function nodeByCardId(id, preferType){
  if(!id) return null;
  let fallback = null;
  for(let i=0;i<nodes.length;i++){
    const n = nodes[i];
    if(n.cardId !== id || n._gone) continue;
    if(!preferType || n.type === preferType) return n;
    if(!fallback) fallback = n;
  }
  return fallback;
}
function srClose(){
  searchResults.classList.remove('on');
  searchResults.innerHTML = '';
  srItems = []; srActive = -1;
}
function srEsc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function srHighlight(s, q){
  const text = srEsc(s);
  const needle = srEsc(String(q||'').trim()).toLowerCase();
  if(!needle) return text;
  const lower = text.toLowerCase();
  let out = '', from = 0, idx;
  while((idx = lower.indexOf(needle, from)) !== -1){
    out += text.slice(from, idx) + '<mark>' + text.slice(idx, idx + needle.length) + '</mark>';
    from = idx + needle.length;
  }
  return out + text.slice(from);
}
const SR_TITLES = { commitment:'承诺', decision:'决定', preference:'偏好', correction:'更正', event:'事件', fact:'事实' };
const SR_ORDER = ['commitment','decision','preference','correction','event','fact'];
function srRenderRows(rows, q, grouped){
  searchResults.innerHTML = '';
  srItems = rows; srActive = -1;
  if(!rows.length){
    const d = document.createElement('div'); d.className='sr-item';
    d.innerHTML = '<span style="color:#5f6d8e">没有匹配的记忆</span>';
    searchResults.appendChild(d);
    searchResults.classList.add('on');
    return;
  }
  let lastGroup = null;
  rows.forEach((row,i)=>{
    if(grouped && row.group !== lastGroup){
      const g = document.createElement('div'); g.className='sr-group';
      g.textContent = SR_TITLES[row.group] || '其它';
      searchResults.appendChild(g); lastGroup = row.group;
    }
    const d = document.createElement('div'); d.className='sr-item'; d.dataset.i = i;
    const color = TYPE[row.node.type] ? TYPE[row.node.type].color : '#9fc3ff';
    d.innerHTML = '<span class="dot" style="color:'+color+';background:'+color+'"></span>'+
      '<span class="sr-tx">'+srHighlight(row.label, q)+'</span>'+
      '<span class="tp">'+srEsc(row.meta)+'</span>';
    d.addEventListener('click', ()=> srPick(i));
    searchResults.appendChild(d);
  });
  searchResults.classList.add('on');
}
function srPick(i){
  const row = srItems[i];
  if(!row) return;
  openNode(row.node);
  srClose();
  searchInput.value = row.label;
}
function srLocal(q){
  const lo = q.toLowerCase();
  const hits = nodes.filter(n=> (n.label+' '+(n.content||'')).toLowerCase().includes(lo)).slice(0,9);
  srRenderRows(hits.map(n=>({ node:n, label:n.label, meta: TYPE[n.type].name })), q, false);
}
function srRemote(q){
  const seq = ++srSeq;
  fetch('/recall?q=' + encodeURIComponent(q) + '&k=12')
    .then(r=>r.json())
    .then(j=>{
      if(seq !== srSeq) return;
      if(!j || !j.ok) throw new Error('接口不可用');
      const items = (j.data && j.data.items) || [];
      const rows = [];
      items.forEach(it=>{
        const prefer = it.type === 'commitment' ? 'commitment' : 'card';
        const n = nodeByCardId(it.id, prefer);
        if(!n) return;
        rows.push({ node:n, label: it.text || n.label, meta: TYPE[n.type].name, group: it.type || '其它' });
      });
      rows.sort((a,b)=>{
        const sa = SR_ORDER.indexOf(a.group) < 0 ? 99 : SR_ORDER.indexOf(a.group);
        const sb = SR_ORDER.indexOf(b.group) < 0 ? 99 : SR_ORDER.indexOf(b.group);
        return sa - sb;
      });
      srRenderRows(rows, q, true);
    })
    .catch(()=>{ if(seq === srSeq) srLocal(q); });
}
function doSearch(q){
  q = (q||'').trim();
  clearTimeout(srTimer);
  if(!q){ srClose(); return; }
  if(!SERVED){ srLocal(q); return; }
  srTimer = setTimeout(()=> srRemote(q), 220);
}
searchInput.addEventListener('input', e=>doSearch(e.target.value));
searchInput.addEventListener('focus', e=>{ if(e.target.value) doSearch(e.target.value); });
searchInput.addEventListener('keydown', e=>{
  if(!searchResults.classList.contains('on')) return;
  const els = searchResults.querySelectorAll('.sr-item[data-i]');
  if(!els.length) return;
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    srActive = e.key === 'ArrowDown' ? (srActive + 1) % els.length : (srActive - 1 + els.length) % els.length;
    els.forEach((el,i)=> el.classList.toggle('sel', i === srActive));
    els[srActive].scrollIntoView({ block:'nearest' });
  } else if(e.key === 'Enter'){
    e.preventDefault();
    if(srActive < 0) srActive = 0;
    srPick(Number(els[srActive].dataset.i));
  }
});
document.addEventListener('click', e=>{
  if(!e.target.closest('.search-wrap')) srClose();
});
document.addEventListener('keydown', e=>{
  if(e.key === '/' && document.activeElement !== searchInput){ e.preventDefault(); searchInput.focus(); }
  if(e.key === 'Escape'){
    closePanel();
    srClose();
  }
});
