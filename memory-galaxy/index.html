/* ---------- P1-5：时间轴 scrubber ---------- */
const scrubDates = [...new Set(DAY_DEFS.map(d=>d.date))].sort();
let focusDay = null;
const scrubEl = document.getElementById('scrubber');
function scrubberSummary(date){
  return DAY_DEFS.filter(d=>d.date===date).map(d=>d.summary).join(' / ');
}
function renderScrubber(){
  if(!scrubEl) return;
  scrubEl.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'sc' + (focusDay ? '' : ' on');

    const b = document.createElement('button');
    b.className = 'sc' + (focusDay===date ? ' on' : '') + (date===scrubDates[scrubDates.length-1] ? ' latest' : '');
    b.textContent = date.slice(5);
    b.title = scrubberSummary(date);
    b.dataset.date = date;
    b.addEventListener('click', ()=> setFocusDay(date, { scroll:true }));
    scrubEl.appendChild(b);
  });
  const sum = document.createElement('div');
  sum.className = 'sc-sum';
  sum.textContent = focusDay ? scrubberSummary(focusDay) : '点击日期高亮当天记忆 · ←/→ 切换 · Enter 定位';
  scrubEl.appendChild(sum);

function scrollListToDay(date){
  if(!document.body.classList.contains('list-open')) return;
  if(curTab !== 'timeline'){
    curTab = 'timeline';
    document.querySelectorAll('#tabs .tab').forEach(x=> x.classList.toggle('on', x.dataset.tab === 'timeline'));

  const blocks = mBody.querySelectorAll('.day-block');
  for(let i=0;i<blocks.length;i++){
    if(blocks[i].dataset.date === date){ blocks[i].scrollIntoView({ block:'center', behavior:'smooth' }); break; }
  }
}
function setFocusDay(date, opts){
  focusDay = date;
  nodes.forEach(n=>{ n._fd = !date || n.dayRef === date; });
  renderScrubber();
  if(opts && opts.scroll && date) scrollListToDay(date);
}
function stepFocusDay(dir){
  if(!focusDay){ setFocusDay(scrubDates[dir > 0 ? 0 : scrubDates.length-1], { scroll:true }); return; }
  const i = scrubDates.indexOf(focusDay);
  const ni = Math.max(0, Math.min(scrubDates.length-1, i + dir));
  setFocusDay(scrubDates[ni], { scroll:true });
}
document.addEventListener('keydown', e=>{
  if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if(e.key === 'ArrowLeft'){ e.preventDefault(); stepFocusDay(-1); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); stepFocusDay(1); }
  else if(e.key === 'Enter' && focusDay){

});

<script>
/* ---------- W2b：最近写入 / 撤销（独立于主渲染，避免动主 IIFE） ---------- */
(function(){
  var modal = document.getElementById('wModal');
  var body = document.getElementById('wBody');
  var btn = document.getElementById('btnWrites');
  if(!modal || !body || !btn) return;
  var isHttp = location.protocol === 'http:' || location.protocol === 'https:';
  var TYPE_LABEL = { commitment:'承诺', preference:'偏好', fact:'事实', event:'事件', decision:'决定', correction:'更正' };

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function showToast(msg){
    var el = document.getElementById('toast');
    if(!el) return;
    el.textContent = msg;
    el.classList.add('on');

    showToast._t = setTimeout(function(){ el.classList.remove('on'); }, 2000);
  }
  function fmtTime(ts){
    var t = String(ts || '');
    return t.length >= 16 ? t.slice(5,16).replace('T',' ') : t;
  }

  function render(items){
    if(!items.length){
      body.innerHTML = '<div class="w-empty">还没有 agent 写入。<br>通过 MCP 工具 <code>memory_note</code> 写入后会出现在这里；约 2 分钟内完成整理。</div>';
      return;
    }
    body.innerHTML = items.map(function(w){
      var hidden = w.hidden, done = w.done;
      var status = hidden ? '已撤销' : (done ? '已完成' : '');
      var btns = hidden
        ? '<span style="font-size:10px;color:#5f6d8e">' + status + '</span>'
        : '<div class="w-btns">' +
            (w.note_id ? '<button class="btn" data-act="undo" data-target="' + esc(w.note_id) + '">撤销</button>' : '') +
            '<button class="btn" data-act="forget" data-target="' + esc(w.card_id) + '">忘记</button>' +
          '</div>';
      return '<div class="w-item' + (hidden ? ' hidden' : '') + '">' +
        '<div class="w-main"><div class="w-tx">' + esc(w.text) + '</div>' +
        '<div class="w-meta">' + (TYPE_LABEL[w.type] || esc(w.type)) + ' · ' + fmtTime(w.ts) +
          ' · ' + esc(w.agent || '-') + (status && !hidden ? ' · ' + status : '') + '</div></div>' +
        btns + '</div>';
    }).join('');
    body.querySelectorAll('button[data-act]').forEach(function(b){

          .catch(function(err){
            b.disabled = false;
            showToast('操作失败：' + err.message);

  function refresh(){
    if(!isHttp){
      body.innerHTML = '<div class="w-empty">当前是本地文件直接打开（file://）。<br>' +

      .then(function(r){ return r.json(); })

        if(!j || !j.ok) throw new Error((j && j.error && j.error.message) || '接口不可用');
        render(j.data.items || []);

      .catch(function(err){
        body.innerHTML = '<div class="w-empty">无法连接 memoryd：' + esc(err.message) + '<br>' +
          '请确认 <code>node bin/memoryd.mjs serve</code> 正在运行。</div>';
      });

  btn.addEventListener('click', function(){ modal.classList.add('open'); refresh(); });

  modal.addEventListener('click', function(e){ if(e.target === modal) modal.classList.remove('open'); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') modal.classList.remove('open'); });
})();

<script>
/* ---------- P0-3：待确认（review）面板，独立于主渲染 ---------- */
(function(){
  var modal = document.getElementById('rModal');
  var body = document.getElementById('rBody');
  var btn = document.getElementById('btnReview');
  var countEl = document.getElementById('reviewCount');
  if(!modal || !body || !btn) return;
  var isHttp = location.protocol === 'http:' || location.protocol === 'https:';
  var REASON = { correction:'更正', low_confidence:'低置信', near_duplicate:'疑似重复' };
  var TYPE_LABEL = { commitment:'承诺', preference:'偏好', fact:'事实', event:'事件', decision:'决定', correction:'更正' };

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function showToast(msg){
    var el = document.getElementById('toast');
    if(!el) return;
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ el.classList.remove('on'); }, 2000);
  }
  function fmtTime(ts){
    var t = String(ts || '');
    return t.length >= 16 ? t.slice(5,16).replace('T',' ') : t;
  }
  function setCount(n){
    countEl.textContent = (n == null ? '—' : String(n));
    btn.classList.toggle('on', n > 0);
  }
  function fetchReviews(){
    if(!isHttp){
      setCount(null);
      btn.disabled = true;
      btn.title = '需通过 memoryd 打开页面';
      return Promise.resolve([]);
    }
    return fetch('/review?status=pending')
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(!j || !j.ok) throw new Error((j && j.error && j.error.message) || '接口不可用');
        var items = (j.data && j.data.items) || [];
        setCount(items.length);
        return items;
      })
      .catch(function(err){
        setCount(null);
        btn.title = '无法连接 memoryd：' + err.message;
        return [];
      });
  }

  function render(items){
    if(!items.length){
      body.innerHTML = '<div class="w-empty">暂无待确认的记忆。<br>' +
        '低置信 / 更正 / 疑似重复的写入会先进入这里，确认后才会进入记忆。</div>';
      return;
    }
    body.innerHTML = items.map(function(it){
      var c = it.candidate || {};
      var type = TYPE_LABEL[c.type] || c.type || '-';
      var reason = REASON[it.reason] || it.reason || '-';
      var conf = (typeof c.confidence === 'number') ? c.confidence.toFixed(2) : '-';
      var confStyle = (typeof c.confidence === 'number' && c.confidence < 0.6) ? 'color:#ffd166' : '';
      var due = c.due_at ? ' · 截止 ' + esc(c.due_at) : '';
      return '<div class="w-item"><div class="w-main">' +
        '<div class="w-tx">' + esc(c.text || '（无文本）') + '</div>' +
        '<div class="w-meta">' + esc(type) + ' · ' + esc(reason) + ' · 置信 ' +
          '<span style="' + confStyle + '">' + conf + '</span> · ' + fmtTime(it.created_at) + due + '</div>' +
        '</div><div class="w-btns">' +
          '<button class="btn" data-act="approve">批准</button>' +
          '<button class="btn" data-act="reject">拒绝</button>' +
        '</div></div>';
    }).join('');

    Array.prototype.forEach.call(body.querySelectorAll('.w-item'), function(el, idx){
      var target = items[idx];
      Array.prototype.forEach.call(el.querySelectorAll('button[data-act]'), function(b){
        b.addEventListener('click', function(){
          var act = b.getAttribute('data-act');
          if(!target) return;
          Array.prototype.forEach.call(body.querySelectorAll('button[data-act]'), function(x){ x.disabled = true; });
          fetch('/review/' + encodeURIComponent(target.review_id) + '/' + act, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: '{}'
          }).then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
            .then(function(res){
              if(!res.ok) throw new Error((res.j && res.j.error && res.j.error.message) || '请求失败');
              showToast(act === 'approve' ? '已批准，页面即将刷新' : '已拒绝，页面即将刷新');
              setTimeout(function(){ location.reload(); }, 700);
            })
            .catch(function(err){
              showToast('操作失败：' + err.message);
              open();
            });
        });
      });
    });
  }

  function open(){
    modal.classList.add('open');
    body.innerHTML = '<div class="w-empty">加载中…</div>';
    fetchReviews().then(render);
  }

  btn.addEventListener('click', function(){
    if(!isHttp){ showToast('需通过 memoryd 打开页面才能确认'); return; }
    open();
  });
  document.getElementById('rClose').addEventListener('click', function(){ modal.classList.remove('open'); });
  modal.addEventListener('click', function(e){ if(e.target === modal) modal.classList.remove('open'); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') modal.classList.remove('open'); });

  // 启动时拉一次待确认计数；弹窗打开/操作后再拉最新
  fetchReviews();
})();
</script>
<script>
/* ---------- P1-1：今日卡片（/today），独立于主渲染 ---------- */
(function(){
  var box = document.getElementById('todayBox');
  if(!box) return;
  var isHttp = location.protocol === 'http:' || location.protocol === 'https:';
  var TYPE_LABEL = { commitment:'承诺', preference:'偏好', fact:'事实', event:'事件', decision:'决定', correction:'更正' };
  var SECS = [
    { key:'due', label:'今日到期', countKey:'due', pref:'commitment' },
    { key:'overdue', label:'逾期', countKey:'overdue', pref:'commitment' },
    { key:'pending', label:'未完成待办', countKey:'pendingOpen', pref:'commitment' },
    { key:'highlights', label:'今日要点', countKey:'cardsToday', pref:'card' }
  ];
  var flat = [];
  var MAX_PER_SEC = 6;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function showToast(msg){
    var el = document.getElementById('toast');
    if(!el) return;
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ el.classList.remove('on'); }, 2000);
  }
  function nodeFor(item, pref){
    var g = window.__galaxy;
    if(!g || !g.nodes) return null;
    var fallback = null;
    for(var i=0;i<g.nodes.length;i++){
      var n = g.nodes[i];
      if(n.cardId !== item.id) continue;
      if(n.type === pref) return n;
      if(!fallback) fallback = n;
    }
    return fallback;
  }
  function openItem(rec){
    var n = nodeFor(rec.item, rec.pref);
    if(!n){ showToast('该条目已不在当前视图'); return; }
    if(n._gone){ showToast('该条目已被忘记'); return; }
    window.__galaxy.openNode(n);
  }

  function render(d){
    flat = [];
    if(!d){ box.innerHTML = '<div class="today-empty">今日数据加载失败，稍后自动重试。</div>'; return; }
    var html = '<div class="today-h"><span>今 日</span><span class="d">' + esc(d.date || '') + '</span>' +
      (d.stale ? '<span class="stale" title="记忆数据超过 26 小时未更新">数据过期</span>' : '') + '</div>';
    var any = false;
    SECS.forEach(function(sec){
      var items = d[sec.key] || [];
      var total = (d.counts && typeof d.counts[sec.countKey] === 'number') ? d.counts[sec.countKey] : items.length;
      if(!total && !items.length) return;
      any = true;
      var shown = Math.min(items.length, MAX_PER_SEC);
      html += '<div class="today-sec"><div class="sh"><b>' + sec.label + '</b><span>' + total + '</span>' +
        (total > shown ? '<span class="n">显示前 ' + shown + ' 条</span>' : '') + '</div>';
      items.slice(0, MAX_PER_SEC).forEach(function(it){
        var meta = '';
        if(sec.key === 'highlights') meta = TYPE_LABEL[it.type] || '';
        else if(it.due_at) meta = '截止 ' + String(it.due_at).slice(5,10);
        else meta = '待办';
        flat.push({ item: it, pref: sec.pref });
        html += '<div class="today-item" data-i="' + (flat.length - 1) + '">' +
          '<span class="t">' + esc(it.text || '') + '</span><span class="m">' + esc(meta) + '</span></div>';
      });
      html += '</div>';
    });
    if(!any) html += '<div class="today-empty">今天没有到期/逾期/待办，也没有新卡片。</div>';
    box.innerHTML = html;
    Array.prototype.forEach.call(box.querySelectorAll('.today-item'), function(el){
      el.addEventListener('click', function(){
        var rec = flat[Number(el.getAttribute('data-i'))];
        if(rec) openItem(rec);
      });
    });
  }

  function refresh(){
    if(!isHttp){
      box.innerHTML = '<div class="today-empty">用 <code>node bin/memoryd.mjs serve</code> 启动后访问 ' +
        '<code>http://127.0.0.1:7788/</code> 可看到今日卡片。</div>';
      return Promise.resolve();
    }
    return fetch('/today?limit=20')
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(!j || !j.ok) throw new Error((j && j.error && j.error.message) || '接口不可用');
        render(j.data);
      })
      .catch(function(){ box.innerHTML = '<div class="today-empty">无法连接 memoryd，今日卡片暂不可用。</div>'; });
  }

  window.__galaxyTodayRefresh = refresh;
  refresh();
  setInterval(function(){ if(!document.hidden) refresh(); }, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) refresh(); });
})();
</script>
<script>
/* ---------- P2：服务状态条（/health：未启动 / degraded / 数据过期） ---------- */
(function(){
  var bar = document.getElementById('healthBar');
  if(!bar) return;
  var isHttp = location.protocol === 'http:' || location.protocol === 'https:';
  function show(msg, isErr){
    bar.textContent = msg;
    bar.className = 'health-bar on' + (isErr ? ' err' : '');
  }
  function hide(){ bar.className = 'health-bar'; }
  function check(){
    if(!isHttp){
      show('当前是本地文件模式：数据为静态快照，页面写操作不可用。用 node bin/memoryd.mjs serve 后访问 http://127.0.0.1:7788/');
      return;
    }
    fetch('/health')
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(!j || !j.ok) throw new Error('接口不可用');
        var d = j.data || {};
        if(d.status && d.status !== 'ok'){ show('memoryd 状态：' + d.status + '（部分数据可能不可用）', true); return; }
        if(d.data && d.data.stale){
          var hrs = Math.round((d.data.ageSec || 0) / 3600);
          show('记忆数据 ' + hrs + ' 小时未更新，可能是每日增量失败（显示的是旧数据）');
          return;
        }
        hide();
      })
      .catch(function(){ show('memoryd 未响应：页面可能是缓存快照，写操作会失败', true); });
  }
  check();
  setInterval(function(){ if(!document.hidden) check(); }, 60000);
})();
</script>
